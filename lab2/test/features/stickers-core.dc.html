<body>
<!-- ONE FILE, FORTY PARTS, FORTY FEATURES — AND IT IS BUILT, NOT DRAWN HERE.
     press/tools/build-sheet.js writes this file from press/tools/parts/<part>.html,
     one part per file, in the order Appendix D of PRESS-TABLE-PLAN.md lists
     them. Edit a part there and rebuild; the next build overwrites this file
     whole and an edit made here is lost. All forty are drawn.

     WHY ONE FILE: the same reason village.dc.html gives at length — a kit
     part is picked up, put down and re-cut on its own, so each is its own
     .gz, and forty near-identical documents would be forty copies of the
     same helmet and the same keyframes. So there is ONE document and the
     section says which part it wants in its data-src —
     features/stickers-core.dc.html#part=burst — a hash and not a query, for
     the reason gnome.dc.html writes out (a static host's clean-URL 301
     drops the query string; a fragment never reaches the server).

     WHY THE COLOURS ARE ROLES AND NOT LITERALS, which is the one way this
     sheet is unlike the other three: a village house is red because the
     village is; a sticker is whatever colour the page it stands on is. So
     no part holds a colour — every fill and stroke is {{ skPrimary }},
     {{ skSecondary }}, {{ skInk }}, {{ skPaper }}, {{ skHighlight }} or
     {{ skShadow }}, every outline width is {{ skStroke }}, every corner
     {{ skRadius }}, every word {{ skText }} — and kits.js fills them ONCE
     per page load from the page's --sk-* tokens (CONTRACTS.md §6, plan
     §8 4.2): the main bench has no such tokens and gets the defaults below,
     which is the Knoll look; a game page's baked :root supplies its own,
     and the same forty drawings are that game's stickers. palette-keys.js
     refuses a part with a literal in it, so this is enforced by the tool
     and not by care.

     WHERE THE DEFAULTS COME FROM: renderVals() below returns the bench's
     own tokens from lab.css :root — --pink #c93b82 as skPrimary, --blue
     #5871f5 as skSecondary, --ink #26212a as skInk, white paper, --pink-2
     #ef4d98 as the highlight, the pink darkened to #8a2558 for the shadow,
     a 3-unit stroke, 6-unit corners and no text — the same nine values
     kits.js keeps in SHEETS.stickers.palette (CONTRACTS.md §7), so the
     sheet opened on its own in Design Canvas is a Knoll sticker.

     WHAT A PART IS (plan §3.6, CONTRACTS.md §8): one <sc-if> holding one
     128 × 128 <svg> whose direct children are <g data-layer="…"> in the
     order halo (hidden — the die-cut edge the style pass turns on), shadow
     (the offset silhouette, the cel shade), body, line (every outline —
     the layer the style pass re-weights, wobbles or removes), highlight
     (the one glint), detail (fine strokes a simple style drops), and for
     some parts image-slot (a paper rect the page may replace with a
     clipped picture) and text (a <text> holding {{ skText }} — a part with
     a <text> is always live, ADDING.md §1.2, which is why NEW and WISHLIST
     are paths). EVERY IMAGE-SLOT RECT IS IN THE data-props BELOW, under
     `slots`, beside `tags`: {x, y, w, h, rot} in the part's own 128 units,
     the rect unrotated and the angle it is turned by about its own centre.
     A part may hold no <image> (ADDING.md §1.2), so a picture in a slot is
     the PAGE's job — press/tools/build-game.js writes the frame section and
     a gz-pic prop clipped to that rect, and this is where it reads the
     rect. Change the drawing and rebuild and the number follows it.
     The sway and the drop-shadow ride on the root svg, the
     compositor's and free (kits.js's header). The shared data-defs svg
     first inside the screen holds the filters and patterns the style pass
     names (#sk-soft, #sk-wobble, #sk-hatch …; press/tools/sk-defs.html
     says what each number is); kits.js copies it into every part.

     THE PROBE NUMBERS (plan §8 4.6, perf/probe-stickers.js — 60 sticker
     sections at each preset, cameras at 20/35/50/100/166/400 %). Measured
     2026-09-07, headed system Chrome 152 on the sandbox server, viewport
     1600 × 1000 at DPR 1, all ten presets ACCEPTED; the floor is the same
     page with nothing at all on the paper, measured in the same run, so
     these are this machine on this day and not a number off a wall.
       idle median per preset — 6.1 ms at every camera, all ten presets,
         which is the empty page's own 6.1 ms at every camera. Sixty
         stickers cost a bench that is standing still NOTHING.
       worst frame per preset — 6.3 to 12.3 ms IN THAT RUN, taken over both
         the idle second and the four-second pan at every camera. ZERO
         frames over 34 ms anywhere in the sixty measurements, which is the
         clause that decides; the three worst of that run (12.1 pixel at
         166 %, 12.2 cel at 20 %, 12.3 ink-sketch at 166 %) are one dropped
         frame in a pan on a 165 Hz screen, not a second slot of work.
         READ THE RANGE AS ONE RUN'S TAIL AND THE 34 ms AS THE LINE. Three
         of the ten — pixel, flat, ink-sketch — were measured again TWICE on
         the same machine on 2026-09-07, each time against a floor measured
         again in the same run, and each time with another verifier's Chrome
         at work on the same machine. Everything the acceptance rests on
         came back to the digit all three times: idle median 6.1 at all six
         cameras, 50 of the sixty live at 166 %, ink-sketch's fifty of fifty
         filtered and twenty swaying, pixel's nought swaying, no documents
         at any camera. The tail wandered and nothing else did — flat's
         worst frame 6.6 → 30.5 → 6.6 ms, pixel's 12.1 → 12.2 → 18.3,
         ink-sketch's 12.3 → 12.3 → 18.3, every one of them a single frame
         in a pan and every one under 34. The idle second is the number to
         keep; a pan's maximum is the machine's mood that minute.
       live count at 166 % per preset — 50 of the sixty are live (over
         125 % kits.js keeps no tiles), 20 of them sway and none is full.
         For the seven presets whose vector reaches an SVG filter
         (outline-cartoon, painterly, ink-sketch, neon, retro-print,
         grunge, cozy-soft) ALL FIFTY are filtered — two and a half times
         the twenty the plan asks the 34 ms rule to be met with, and the
         part records and a walk of the live DOM agree on the count.
         flat, cel and pixel reach no filter at all; a pixel part is a
         canvas and never sways, so its sway count is 0.
       SWAY_MAX share for wobble / glow — 1, UNCHANGED. Nothing failed at
         166 %, so kits.js's SHEETS.stickers.swayShare keeps the plan's
         default; shareOf() there is already written to read a per-preset
         object the day one is needed. Numbers, tables and two screenshots
         a preset in perf/results/stickers/. -->
<x-dc>
<helmet>
<style>
  body { margin: 0; }

  /* The sheet's two keyframes. sk-sway is a skew and not the forest's
     rotate: a sticker is a flat thing on a flat page and a skew reads as
     the page breathing under it where a rotation reads as the sticker
     coming unstuck; ±2° is half the village's kh-sway (±4°), because a
     sticker sways less than a signpost. Every part's root runs it
     4.2 s ease-in-out alternate, started 1.1 s in so forty of them on a
     page do not swing together. sk-bob is 4 px straight down and back,
     for the parts that hang rather than stand — a pin, a bubble — and a
     part that uses it says why in its leading comment. */
  @keyframes sk-sway { from { transform: skewX(-2deg) } to { transform: skewX(2deg) } }
  @keyframes sk-bob { from { transform: translateY(0) } to { transform: translateY(4px) } }

  /* THE JIGGLE is lab 2's, not the sheet's — the same lines forest.dc.html
     and village.dc.html carry. frames.js writes data-lab-drag onto this
     document's <html> for as long as somebody is carrying the thing about,
     and a sticker picked up ought to shake. !important on both under
     data-lab-drag, as the forest has it: the sway rides on each root's own
     style= and an inline animation would otherwise beat this rule for the
     length of the carry. The bare rule keeps no !important on purpose.
     :not([data-defs]) because the first child of the screen is the shared
     defs svg, and animating that is animating nothing, slowly. The pivot is
     the centre — a sticker has no root to pivot on, unlike a tree. */
  @keyframes jiggle {
    0%, 100% { transform: rotate(-4deg); }
    25%      { transform: rotate(3.5deg); }
    50%      { transform: rotate(-2.5deg); }
    75%      { transform: rotate(4.5deg); }
  }
  html[data-lab-drag] [data-stickers] > svg:not([data-defs]) { animation: jiggle .3s ease-in-out infinite !important; transform-origin: 50% 50% !important; }
  [data-stickers] > svg:not([data-defs]) { transform-origin: 50% 50%; }
</style>
</helmet>
<div data-screen-label="Sticker Part" data-stickers style="min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative">

<!-- SK-DEFS — the sticker sheet's shared <defs>: the filters and patterns the
     style pass reaches for (PRESS-TABLE-PLAN.md §8 4.4), in one 0×0 svg that
     build-sheet.js puts FIRST inside the screen of stickers-core.dc.html, the
     way village.dc.html carries #pine and #ds. kits.js copies a data-defs svg
     into every part it extracts (ADDING.md §2), so a part restyled with
     filter:url(#sk-soft) or fill="url(#sk-hatch)" finds the id in its own
     document, live or sprite. No part references any of these by hand —
     palette-keys.js refuses a url(#…) in a fill — they are the style pass's
     to add, and a part drawn without them is the flat preset.

     EVERY COLOUR IS A ROLE. The patterns are drawn in {{ skShadow }} (the
     shading ones: hatch, dots, dither — they replace the shadow layer's
     fill) or {{ skInk }} (the textures: paper, noise, scanlines, grunge —
     they lie over the body), so they follow the page's palette the way the
     parts do. The filters carry no colour at all. build-sheet.js runs the
     same colour scan over this file as over a part.

     CAMEL-CASE ATTRIBUTES are written sc-camel-* (stdDeviation →
     sc-camel-std-deviation, baseFrequency → sc-camel-base-frequency,
     patternUnits → sc-camel-pattern-units …) as the village writes its
     feDropShadow's stdDeviation: the sheet is read by two parsers, support.js
     (which turns the prefix into the camel-cased React prop the SVG DOM
     wants) and kits.js's decodeAttrs (which does the same by hand), and an
     HTML parser handed the bare camel name lower-cases it. Element names
     (feGaussianBlur, feTurbulence …) need no help: the HTML parser's own
     foreign-content table restores their case, which is how the village's
     feDropShadow has always worked.

     THE NUMBERS, one sentence each:
     · #sk-soft blurs by 2 units — a soft-shaded sticker's shadow edge is a
       little wider than the 3-unit line, not a fog: 2 is the plan's "2-unit
       blur"; the region is widened 30 % each way so the blur is not clipped
       at the shadow's own bounds.
     · #sk-wobble: fractal noise at baseFrequency 0.04 (one ripple every
       25 units — two or three along a 64-unit edge, a hand's tremor rather
       than a scribble), 2 octaves (one adds fine grain the 3-unit line
       would just alias), seed 3, displacement scale 4 (the plan's unit —
       the page multiplies it by lineWobble, so 4 is the wobble at 1.0, which
       is a line that leaves its path by a stroke's width and no more).
       Units are userSpaceOnUse so the same 4 means the same thing in every
       part; the filter region is the whole box plus a margin of 8, so a
       displaced line at the edge is not clipped.
     · #sk-wobble-2: the same at seed 11, for the second pass when
       linePasses > 1 — a different seed so the two lines do not sit on each
       other, a nearby one so they still look drawn by the same hand.
     · #sk-hatch: one 45° line corner to corner in a 6×6 cell, stroke 1.5 —
       six units apart is four lines across a 24-unit shadow rim, and a line
       half the default stroke reads as hatching rather than as a second
       outline.
     · #sk-dots: a circle of radius 1.6 in a 6×6 cell — a 27 % halftone dot
       (π·1.6² over 36), the mid-tone a printed shadow is.
     · #sk-dither: two 2×2 squares on a 4×4 checker — a 50 % ordered dither
       at 2 units, the coarsest pattern that still reads as tone and not as a
       chequerboard at sprite size.
     · #sk-paper: five short fibres in a 24×24 cell at stroke-opacity .12 —
       a tile big enough not to repeat visibly across a 128 box (five across)
       and faint enough that the body colour still reads as the body colour
       when the page lays it at 18 % (plan §8 4.4) — .12 × .18 is a 2 %
       fibre.
     · #sk-noise: nine 1×1 specks in an 8×8 cell at opacity .18 — 14 %
       coverage, scattered by hand so no row or column holds two.
     · #sk-scanlines: a 1-unit line every 3 — one dark row in three, the
       pitch of a CRT at sticker scale; opacity .25 so the row is a shade,
       not a stripe.
     · #sk-grunge: three irregular blobs in a 32×32 cell at opacity .16 —
       big cells so the wear does not tile visibly, few blobs so a sticker
       is worn, not filthy. -->
<svg data-defs width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sk-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur sc-camel-std-deviation="2"></feGaussianBlur>
    </filter>
    <filter id="sk-wobble" sc-camel-filter-units="userSpaceOnUse" sc-camel-primitive-units="userSpaceOnUse" x="-8" y="-8" width="144" height="144">
      <feTurbulence type="fractalNoise" sc-camel-base-frequency="0.04" sc-camel-num-octaves="2" seed="3" result="sk-n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="sk-n" scale="4" sc-camel-x-channel-selector="R" sc-camel-y-channel-selector="G"></feDisplacementMap>
    </filter>
    <filter id="sk-wobble-2" sc-camel-filter-units="userSpaceOnUse" sc-camel-primitive-units="userSpaceOnUse" x="-8" y="-8" width="144" height="144">
      <feTurbulence type="fractalNoise" sc-camel-base-frequency="0.04" sc-camel-num-octaves="2" seed="11" result="sk-n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="sk-n" scale="4" sc-camel-x-channel-selector="R" sc-camel-y-channel-selector="G"></feDisplacementMap>
    </filter>
    <pattern id="sk-hatch" width="6" height="6" sc-camel-pattern-units="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="0" stroke="{{ skShadow }}" stroke-width="1.5"></line>
    </pattern>
    <pattern id="sk-dots" width="6" height="6" sc-camel-pattern-units="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="{{ skShadow }}"></circle>
    </pattern>
    <pattern id="sk-dither" width="4" height="4" sc-camel-pattern-units="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="{{ skShadow }}"></rect>
      <rect x="2" y="2" width="2" height="2" fill="{{ skShadow }}"></rect>
    </pattern>
    <pattern id="sk-paper" width="24" height="24" sc-camel-pattern-units="userSpaceOnUse">
      <g stroke="{{ skInk }}" stroke-width="1" stroke-opacity=".12" stroke-linecap="round">
        <line x1="2" y1="5" x2="9" y2="4"></line>
        <line x1="14" y1="2" x2="21" y2="3"></line>
        <line x1="4" y1="14" x2="10" y2="16"></line>
        <line x1="15" y1="11" x2="22" y2="10"></line>
        <line x1="8" y1="21" x2="16" y2="20"></line>
      </g>
    </pattern>
    <pattern id="sk-noise" width="8" height="8" sc-camel-pattern-units="userSpaceOnUse">
      <g fill="{{ skInk }}" opacity=".18">
        <rect x="0" y="3" width="1" height="1"></rect>
        <rect x="1" y="6" width="1" height="1"></rect>
        <rect x="2" y="0" width="1" height="1"></rect>
        <rect x="3" y="4" width="1" height="1"></rect>
        <rect x="4" y="1" width="1" height="1"></rect>
        <rect x="5" y="7" width="1" height="1"></rect>
        <rect x="6" y="2" width="1" height="1"></rect>
        <rect x="7" y="5" width="1" height="1"></rect>
      </g>
    </pattern>
    <pattern id="sk-scanlines" width="1" height="3" sc-camel-pattern-units="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="{{ skInk }}" opacity=".25"></rect>
    </pattern>
    <pattern id="sk-grunge" width="32" height="32" sc-camel-pattern-units="userSpaceOnUse">
      <g fill="{{ skInk }}" opacity=".16">
        <path d="M3,6 Q7,2 11,5 Q14,9 10,12 Q6,14 3,11 Q1,9 3,6 Z"></path>
        <path d="M19,17 Q24,14 28,18 Q30,22 26,25 Q22,27 19,24 Q16,21 19,17 Z"></path>
        <path d="M8,22 Q11,20 13,23 Q14,26 11,28 Q8,29 7,26 Q6,24 8,22 Z"></path>
      </g>
    </pattern>
  </defs>
</svg>

  <!-- 01 · BURST — 12-point starburst · hype, sale, retro -->
<!-- BURST — the 12-point starburst, the "SALE!" shape, and the reference
     part every other sticker is drawn against (PRESS-TABLE-PLAN.md Appendix
     D: tags hype, sale, retro). Layers: halo shadow body line highlight
     detail.

     THE STAR is 24 vertices at 15° steps with a tip straight up: tips at
     radius 60 (the widest the 128 box allows once the halo's 3 outside the
     edge and the round join at a tip are added — the halo reaches 1 and
     127, nothing spills), valleys at radius 46 — a depth of 14, deep enough
     that twelve points still read as points at 40 px, shallow enough that
     the sticker stays a disc of colour and not a set of spikes. The same
     path is drawn four times: as the halo's stroke, as the shadow, as the
     body and as the line, which is what makes the halo and the shadow the
     silhouette exactly.

     THE SHADOW is the silhouette moved 3 units down and right — the least
     the contract's 3–4 allows, so that with the halo ON (a 6-wide stroke,
     3 outside the body) the shadow's rim stays inside the paper edge on the
     diagonal. Under the body it shows only as a sliver along the lower-right
     edges of the tips: the cel shade.

     THE HIGHLIGHT is one glint — an ellipse 10 × 4.5 tilted −40° near the
     upper-left inner edge, at the mirror of the shadow's corner, and a dot
     of radius 3 above it — the one shine a vinyl sticker has.

     THE DETAIL is a ring of 24 short dashes on radius 34, stroke 1.5 (half
     the default line): 24 × 8.9 = 213.6 = 2π·34, so the dashes close on
     themselves with no seam at the top. A simple style drops it and the
     star is still the star. -->
<sc-if value="{{ isBurst }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M64,4 L75.9,19.6 L94,12 L96.5,31.5 L116,34 L108.4,52.1 L124,64 L108.4,75.9 L116,94 L96.5,96.5 L94,116 L75.9,108.4 L64,124 L52.1,108.4 L34,116 L31.5,96.5 L12,94 L19.6,75.9 L4,64 L19.6,52.1 L12,34 L31.5,31.5 L34,12 L52.1,19.6 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M64,4 L75.9,19.6 L94,12 L96.5,31.5 L116,34 L108.4,52.1 L124,64 L108.4,75.9 L116,94 L96.5,96.5 L94,116 L75.9,108.4 L64,124 L52.1,108.4 L34,116 L31.5,96.5 L12,94 L19.6,75.9 L4,64 L19.6,52.1 L12,34 L31.5,31.5 L34,12 L52.1,19.6 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M64,4 L75.9,19.6 L94,12 L96.5,31.5 L116,34 L108.4,52.1 L124,64 L108.4,75.9 L116,94 L96.5,96.5 L94,116 L75.9,108.4 L64,124 L52.1,108.4 L34,116 L31.5,96.5 L12,94 L19.6,75.9 L4,64 L19.6,52.1 L12,34 L31.5,31.5 L34,12 L52.1,19.6 Z" fill="{{ skPrimary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M64,4 L75.9,19.6 L94,12 L96.5,31.5 L116,34 L108.4,52.1 L124,64 L108.4,75.9 L116,94 L96.5,96.5 L94,116 L75.9,108.4 L64,124 L52.1,108.4 L34,116 L31.5,96.5 L12,94 L19.6,75.9 L4,64 L19.6,52.1 L12,34 L31.5,31.5 L34,12 L52.1,19.6 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="42" cy="46" rx="10" ry="4.5" transform="rotate(-40 42 46)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="54" cy="34" r="3" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <circle cx="64" cy="64" r="34" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5.9"></circle>
    </g>
  </svg>
</sc-if>

  <!-- 02 · BURST ROUND — soft 8-lobe burst · hype, cozy -->
<!-- BURST-ROUND — the soft eight-lobe burst, the burst's cosier sibling: the
     same disc of colour with its points swapped for bumps (PRESS-TABLE-PLAN.md
     Appendix D: tags hype, cozy). Layers: halo shadow body line highlight
     detail.

     THE SCALLOP is eight circles of radius 20 whose centres sit 40 from the
     middle, joined valley to valley by one arc each — ten path commands for
     the whole silhouette. A lobe's tip is at radius 60, the widest the 128 box
     allows with the halo's 3 outside the edge (the halo reaches 1 and 127);
     the valleys, where neighbouring lobes meet, fall at radius 49.8, so the
     scallop is 10.2 deep — enough that eight bumps still read as bumps at
     40 px, shallow enough that it stays a round badge and not a flower. The
     same path is the halo's stroke, the shadow, the body and the line, which
     is what keeps the halo and the shadow the silhouette exactly.

     THE SHADOW is the silhouette moved 3 down and right — the least the
     contract's 3–4 allows, so that with the halo on the shadow's rim stays
     inside the paper edge on the diagonal. Under the body it is a sliver
     along the lower-right of each lobe: the cel shade.

     THE HIGHLIGHT is the one glint a vinyl sticker has, and it sits on the
     upper-left lobe rather than in the middle where the burst's does, because
     the middle here is ringed by the detail rim and a glint across a line is
     a smudge: an ellipse 7 × 3 tilted −45° at (27,27) — on the diagonal of
     the lobe centred at (35.7,35.7), 12.3 out from that centre and so 7.7 in
     from its rim of 20, the long axis along the rim; the near flank stops
     4.7 short of the rim and 3.2 short of the line's inner edge — and a dot
     of radius 2.5 at (50,25), inside the top lobe (centre (64,24)) 14 out
     from its centre, so its edge stops 2 short of the line's inner edge —
     the second catch of light.

     THE DETAIL is the scallop again at 3/5 size (lobes of radius 12 centred
     24 out, tips at 36, valleys at 29.9) drawn at stroke 1.5, half the
     default line: an inner rim, the way a soft badge is printed. A simple
     style drops it and the burst is still the burst. -->
<sc-if value="{{ isBurstRound }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">

<script type="text/x-dc" data-dc-script data-props="{&quot;part&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;default&quot;:&quot;burst&quot;,&quot;options&quot;:[&quot;burst&quot;,&quot;burst-round&quot;,&quot;banner&quot;,&quot;ribbon-corner&quot;,&quot;badge-round&quot;,&quot;badge-shield&quot;,&quot;tape-strip&quot;,&quot;tape-x&quot;,&quot;frame-polaroid&quot;,&quot;frame-ornate&quot;,&quot;frame-pixel&quot;,&quot;frame-film&quot;,&quot;arrow&quot;,&quot;arrow-double&quot;,&quot;pointer-hand&quot;,&quot;circle-mark&quot;,&quot;underline&quot;,&quot;bubble-speech&quot;,&quot;bubble-thought&quot;,&quot;bubble-shout&quot;,&quot;tag-new&quot;,&quot;tag-soon&quot;,&quot;tag-wishlist&quot;,&quot;tag-price&quot;,&quot;pin&quot;,&quot;clip&quot;,&quot;star&quot;,&quot;stars-3&quot;,&quot;sparkle&quot;,&quot;heart&quot;,&quot;fire&quot;,&quot;bolt&quot;,&quot;skull&quot;,&quot;sword&quot;,&quot;gear&quot;,&quot;hex-grid&quot;,&quot;leaf-sprig&quot;,&quot;mushroom&quot;,&quot;cloud&quot;,&quot;crescent&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stickers&quot;,&quot;tags&quot;:{&quot;burst&quot;:[&quot;hype&quot;,&quot;sale&quot;,&quot;retro&quot;],&quot;burst-round&quot;:[&quot;hype&quot;,&quot;cozy&quot;],&quot;banner&quot;:[&quot;title&quot;,&quot;hype&quot;],&quot;ribbon-corner&quot;:[&quot;sale&quot;,&quot;new&quot;],&quot;badge-round&quot;:[&quot;award&quot;,&quot;seal&quot;],&quot;badge-shield&quot;:[&quot;award&quot;,&quot;fantasy&quot;],&quot;tape-strip&quot;:[&quot;scrapbook&quot;,&quot;cozy&quot;],&quot;tape-x&quot;:[&quot;scrapbook&quot;],&quot;frame-polaroid&quot;:[&quot;scrapbook&quot;,&quot;screenshot&quot;],&quot;frame-ornate&quot;:[&quot;fantasy&quot;,&quot;award&quot;],&quot;frame-pixel&quot;:[&quot;retro&quot;,&quot;pixel&quot;],&quot;frame-film&quot;:[&quot;cinema&quot;,&quot;screenshot&quot;],&quot;arrow&quot;:[&quot;pointer&quot;],&quot;arrow-double&quot;:[&quot;pointer&quot;],&quot;pointer-hand&quot;:[&quot;pointer&quot;,&quot;retro&quot;],&quot;circle-mark&quot;:[&quot;pointer&quot;,&quot;sketch&quot;],&quot;underline&quot;:[&quot;pointer&quot;,&quot;sketch&quot;],&quot;bubble-speech&quot;:[&quot;comic&quot;],&quot;bubble-thought&quot;:[&quot;comic&quot;],&quot;bubble-shout&quot;:[&quot;comic&quot;,&quot;hype&quot;],&quot;tag-new&quot;:[&quot;new&quot;,&quot;sale&quot;],&quot;tag-soon&quot;:[&quot;new&quot;],&quot;tag-wishlist&quot;:[&quot;store&quot;],&quot;tag-price&quot;:[&quot;store&quot;],&quot;pin&quot;:[&quot;scrapbook&quot;],&quot;clip&quot;:[&quot;scrapbook&quot;],&quot;star&quot;:[&quot;vote&quot;,&quot;award&quot;],&quot;stars-3&quot;:[&quot;sparkle&quot;],&quot;sparkle&quot;:[&quot;sparkle&quot;,&quot;magic&quot;],&quot;heart&quot;:[&quot;vote&quot;,&quot;cozy&quot;],&quot;fire&quot;:[&quot;hype&quot;,&quot;fire&quot;],&quot;bolt&quot;:[&quot;hype&quot;,&quot;storm&quot;,&quot;energy&quot;],&quot;skull&quot;:[&quot;skull&quot;,&quot;horror&quot;,&quot;grunge&quot;],&quot;sword&quot;:[&quot;sword&quot;,&quot;fantasy&quot;],&quot;gear&quot;:[&quot;gear&quot;,&quot;scifi&quot;,&quot;machine&quot;],&quot;hex-grid&quot;:[&quot;scifi&quot;,&quot;tech&quot;],&quot;leaf-sprig&quot;:[&quot;leaf&quot;,&quot;cozy&quot;,&quot;nature&quot;],&quot;mushroom&quot;:[&quot;mushroom&quot;,&quot;cozy&quot;,&quot;fantasy&quot;],&quot;cloud&quot;:[&quot;cloud&quot;,&quot;cozy&quot;],&quot;crescent&quot;:[&quot;moon&quot;,&quot;night&quot;,&quot;fantasy&quot;]},&quot;slots&quot;:{&quot;badge-round&quot;:{&quot;x&quot;:46,&quot;y&quot;:34,&quot;w&quot;:36,&quot;h&quot;:36,&quot;rot&quot;:0},&quot;frame-polaroid&quot;:{&quot;x&quot;:29.3,&quot;y&quot;:22.03,&quot;w&quot;:68,&quot;h&quot;:68,&quot;rot&quot;:-5},&quot;frame-ornate&quot;:{&quot;x&quot;:32,&quot;y&quot;:28,&quot;w&quot;:64,&quot;h&quot;:72,&quot;rot&quot;:0},&quot;frame-pixel&quot;:{&quot;x&quot;:36,&quot;y&quot;:36,&quot;w&quot;:56,&quot;h&quot;:56,&quot;rot&quot;:0},&quot;frame-film&quot;:{&quot;x&quot;:20,&quot;y&quot;:38,&quot;w&quot;:88,&quot;h&quot;:52,&quot;rot&quot;:0}}}}">
/* The long note is the HTML comment at the top of <body>: one file, forty
   parts, colours as roles, built by press/tools/build-sheet.js.

   `part` is a real prop with a real default, so the file still opens as
   itself in Design Canvas with nothing on the end of it at all; a section
   on the bench says which part it wants with #part= in its data-src, and
   kits.js reads the same is-flags off the sc-ifs. The nine palette values
   are the Knoll defaults (CONTRACTS.md §7) and are what Design Canvas and a
   bare open of this file see; kits.js never calls renderVals() — it fills
   the {{ }} itself from the page's --sk-* tokens. */
class Component extends DCLogic {
  renderVals() {
    let part = this.props.part;
    try {
      const m = /(?:^|[#&?])part=([\w-]+)/.exec(location.hash + location.search);
      if (m) part = m[1];
    } catch (e) {}
    part = part || 'burst';
    return {
      skPrimary: '#c93b82',
      skSecondary: '#5871f5',
      skInk: '#26212a',
      skPaper: '#ffffff',
      skHighlight: '#ef4d98',
      skShadow: '#8a2558',
      skStroke: 3,
      skRadius: 6,
      skText: '',
      isBurst: part === 'burst',
      isBurstRound: part === 'burst-round',
      isBanner: part === 'banner',

      isBadgeRound: part === 'badge-round',
      isBadgeShield: part === 'badge-shield',
      isTapeStrip: part === 'tape-strip',
      isTapeX: part === 'tape-x',
      isFramePolaroid: part === 'frame-polaroid',
      isFrameOrnate: part === 'frame-ornate',
      isFramePixel: part === 'frame-pixel',
      isFrameFilm: part === 'frame-film',
      isArrow: part === 'arrow',
      isArrowDouble: part === 'arrow-double',
      isPointerHand: part === 'pointer-hand',
      isCircleMark: part === 'circle-mark',
      isUnderline: part === 'underline',
      isBubbleSpeech: part === 'bubble-speech',
      isBubbleThought: part === 'bubble-thought',
      isBubbleShout: part === 'bubble-shout',
      isTagNew: part === 'tag-new',
      isTagSoon: part === 'tag-soon',
      isTagWishlist: part === 'tag-wishlist',
      isTagPrice: part === 'tag-price',
      isPin: part === 'pin',
      isClip: part === 'clip',
      isStar: part === 'star',
      isStars3: part === 'stars-3',
      isSparkle: part === 'sparkle',
      isHeart: part === 'heart',
      isFire: part === 'fire',
      isBolt: part === 'bolt',
      isSkull: part === 'skull',
      isSword: part === 'sword',
      isGear: part === 'gear',
      isHexGrid: part === 'hex-grid',
      isLeafSprig: part === 'leaf-sprig',
      isMushroom: part === 'mushroom',
      isCloud: part === 'cloud',
      isCrescent: part === 'crescent',

}
