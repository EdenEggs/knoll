<!-- TAG-SOON — the luggage tag that says COMING SOON, the wishlist-page
     tease (PRESS-TABLE-PLAN.md Appendix D: tags new). Layers: halo shadow
     body line highlight detail. No text slot: the words are drawn, ten
     block letters as filled paths, so the tag can be a sprite (a <text>
     part is always live, ADDING.md §1.2).

     THE TAG is tag-new's tag exactly — the same pentagon (point (11,64),
     shoulders at x 35, far corners at x 117, 60 tall, y 34..94) turned 14°
     clockwise about the box centre, the same eyelet, face, string, shadow
     and glint — so the three tags read as one set and a page may swap one
     for another without the box changing. tag-new.html carries the
     sentence for every one of those numbers; this file says only what is
     different, which is the words.

     THE WORDS are two lines, COMING over SOON, in the kit's block alphabet
     (a 14-tall cell, stems 3, bars 2.8; C O M I N G S advance 10 10 14 3
     10 10 10, with 2 between). One line of eleven characters would be 8.8
     tall on this face — a tag whose word is a grey bar at 40 px — so it
     breaks at the space. COMING is 67 cell-units wide, the wider line, and
     the face is 69 with 61 usable after a 4 margin: scale ×0.91, so COMING
     is 61 × 12.7 and SOON (46 wide) is 41.9 × 12.7, each centred on the
     face's x 78.5 (translate 48 and 57.6). The lines are 3.2 apart — a
     quarter of the cap height, close enough to read as one phrase — and
     the pair is 28.7 tall, centred on the face's y 64: line 1 at y 49.65,
     line 2 at 65.6. Every letter is one path of 13 commands or fewer; M
     (13) has its V's arms at a perpendicular 2.4, thinner than the stems,
     the way Impact does it, so the notch between them stays open at
     12.7 tall. -->
<sc-if value="{{ isTagSoon }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M11,64 L35,34 H117 V94 H35 Z" transform="rotate(14 64 64)" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M26.5,52.5 C23.5,46.5 20.5,39.5 17.5,32.5 M31,52 C27.5,45.5 22.5,39 19,32.5" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linecap="round"></path>
      <ellipse cx="13.5" cy="21.5" rx="5.5" ry="8" transform="rotate(-30 13.5 21.5)" fill="none" stroke="{{ skPaper }}" stroke-width="6"></ellipse>
    </g>
    <g data-layer="shadow">
      <path d="M11,64 L35,34 H117 V94 H35 Z" transform="translate(3 3) rotate(14 64 64)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <g transform="rotate(14 64 64)">
        <path d="M11,64 L35,34 H117 V94 H35 Z" fill="{{ skPrimary }}"></path>
        <rect x="44" y="41" width="69" height="46" sc-camel-rx="{{ skRadius }}" fill="{{ skPaper }}"></rect>
        <circle cx="28" cy="64" r="7" fill="{{ skSecondary }}"></circle>
        <circle cx="28" cy="64" r="3.2" fill="{{ skPaper }}"></circle>
        <g transform="translate(48 49.65) scale(0.91)">
          <path transform="translate(0 0)" d="M0,0 H10 V2.8 H3 V11.2 H10 V14 H0 Z" fill="{{ skInk }}"></path>
          <path transform="translate(12 0)" d="M0,0 H10 V14 H0 Z M3,2.8 V11.2 H7 V2.8 Z" fill="{{ skInk }}" fill-rule="evenodd"></path>
          <path transform="translate(24 0)" d="M0,14 V0 H3.5 L7,7.6 L10.5,0 H14 V14 H11 V4.6 L7,13.4 L3,4.6 V14 Z" fill="{{ skInk }}"></path>
          <path transform="translate(40 0)" d="M0,0 H3 V14 H0 Z" fill="{{ skInk }}"></path>
          <path transform="translate(45 0)" d="M0,14 V0 H3.2 L7,7.6 V0 H10 V14 H6.8 L3,6.4 V14 Z" fill="{{ skInk }}"></path>
          <path transform="translate(57 0)" d="M0,0 H10 V2.8 H3 V11.2 H7 V8.4 H5.5 V5.6 H10 V14 H0 Z" fill="{{ skInk }}"></path>
        </g>
        <g transform="translate(57.6 65.6) scale(0.91)">
          <path transform="translate(0 0)" d="M0,0 H10 V2.8 H3 V5.6 H10 V14 H0 V11.2 H7 V8.4 H0 Z" fill="{{ skInk }}"></path>
          <path transform="translate(12 0)" d="M0,0 H10 V14 H0 Z M3,2.8 V11.2 H7 V2.8 Z" fill="{{ skInk }}" fill-rule="evenodd"></path>
          <path transform="translate(24 0)" d="M0,0 H10 V14 H0 Z M3,2.8 V11.2 H7 V2.8 Z" fill="{{ skInk }}" fill-rule="evenodd"></path>
          <path transform="translate(36 0)" d="M0,14 V0 H3.2 L7,7.6 V0 H10 V14 H6.8 L3,6.4 V14 Z" fill="{{ skInk }}"></path>
        </g>
      </g>
      <circle cx="18" cy="31" r="2.4" fill="{{ skInk }}"></circle>
    </g>
    <g data-layer="line">
      <path d="M11,64 L35,34 H117 V94 H35 Z" transform="rotate(14 64 64)" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <circle cx="28" cy="64" r="7" transform="rotate(14 64 64)" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}"></circle>
      <path d="M26.5,52.5 C23.5,46.5 20.5,39.5 17.5,32.5 M31,52 C27.5,45.5 22.5,39 19,32.5" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linecap="round"></path>
      <ellipse cx="13.5" cy="21.5" rx="5.5" ry="8" transform="rotate(-30 13.5 21.5)" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}"></ellipse>
    </g>
    <g data-layer="highlight">
      <g transform="rotate(14 64 64)">
        <ellipse cx="32" cy="45" rx="6" ry="2.2" transform="rotate(-51 32 45)" fill="{{ skHighlight }}"></ellipse>
        <circle cx="39" cy="38" r="2" fill="{{ skHighlight }}"></circle>
      </g>
    </g>
    <g data-layer="detail">
      <g transform="rotate(14 64 64)">
        <rect x="44" y="41" width="69" height="46" sc-camel-rx="{{ skRadius }}" fill="none" stroke="{{ skInk }}" stroke-width="1.5"></rect>
        <circle cx="28" cy="64" r="3.2" fill="none" stroke="{{ skInk }}" stroke-width="1.5"></circle>
      </g>
    </g>
  </svg>
</sc-if>
