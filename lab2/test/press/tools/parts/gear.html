<!-- GEAR — an eight-tooth cog, the "machine" sticker (PRESS-TABLE-PLAN.md
     Appendix D: tags gear, scifi, machine — gear is a motif the vision
     call matches). Layers: halo shadow body line highlight detail.

     THE COG is eight teeth on a 45° pitch: tips at radius 60 (the widest
     the box allows once the halo's 3 and the round join at a tip are
     added — the halo reaches 1 and 127, as burst's does), roots at 46,
     each tooth 16° across at the tip and 24° at the root with a 21° arc of
     root between teeth. Eight because six looks like a flower and twelve
     is the burst; and a depth of 14 is what keeps a tooth a tooth at 40 px
     — shallower and the rim is merely bumpy. The path is 8 × (three lines
     and one arc) = 34 commands, and it is drawn four times — halo stroke,
     shadow, body, line — so the die-cut edge and the cel shade are the
     silhouette exactly.

     THE FACE is a disc of radius 32 in {{ skSecondary }} inside the rim,
     and THE BORE a circle of radius 13 in {{ skPaper }} — a hole in a
     sticker shows the paper, and on a dark page the paper is dark, so the
     hole stays a hole. Both are outlined in the line layer.

     THE SHADOW is the silhouette moved 3 down and right, the least the
     contract allows (burst says why).

     THE HIGHLIGHT is one glint on the rim's upper left, an ellipse 7 × 3
     at radius 39 turned −45° to run along the rim (the ring between the
     face and the roots is 32..46, so the glint clears both outlines), and
     a dot of radius 2.5 beside it at radius 38.6.

     THE DETAIL is four rivets: circles of radius 2.5, stroke 1.5 (half the
     default line), at radius 23 on the diagonals — inside the face
     (32 − 1.5) and clear of the bore (13 + 1.5). A simple style drops them
     and the cog is still the cog. -->
