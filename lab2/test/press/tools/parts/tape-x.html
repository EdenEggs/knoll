<!-- TAPE-X — two pieces of washi tape crossed over each other, the way a
     corner gets held down when one strip is not enough (PRESS-TABLE-PLAN.md
     Appendix D: tags scrapbook). Layers: halo shadow body line highlight
     detail.

     THE TWO STRIPS are each 110 × 30 in their own frame (x −55..55,
     y −15..15), turned 45° and −45° about the centre of the box, so they
     cross at a right angle: the bounding square of a 110 × 30 strip at 45°
     is 99 across (55 + 15 on each side, times √2 over 2), which with the
     3-unit line spans about 13..115 both ways — four fifths of the box,
     and room for the shadow. 30 tall, not the single strip's 48, because
     two crossing strips at 48 would be a cross-shaped blob and not two
     tapes. Their torn ends are drawn separately so the two pieces are not
     the same piece twice.

     WHICH STRIP IS ON TOP is decided once, in every layer: the strip at
     −45° (low left to high right) is under, the strip at 45° is over. The
     under strip's outline in the line layer is therefore drawn as two open
     halves that stop at u = ±15, the over strip's edges — a closed outline
     would draw the under strip's edges across the over strip's face. The
     stroke's round caps reach 1.5 past ±15 and the over strip's own outline
     stroke, 1.5 each side of u = ±15, covers them. The under strip's
     stripes stop at |u| = 16 for the same reason.

     THE STRIPES are the washi, as on tape-strip: bands 6 wide on a 13
     pitch in {{ skHighlight }}, leaning 11 across the 30 height, seven on
     the over strip and four on the under strip (the overlap takes the
     middle three). The lighter role, not an opacity, is what makes the
     tape look half-see-through on every palette.

     THE SHADOW is both silhouettes moved 3 down and right, under both
     bodies — the over strip's shadow on the under strip would need a
     shadow above a body, which the layer order does not have, and at
     sticker scale the crossing reads without it.

     THE DETAIL is one tear line at each of the four ends, stroke 1.5,
     running 5 units in from a tooth valley. -->
