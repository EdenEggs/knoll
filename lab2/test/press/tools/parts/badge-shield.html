<!-- BADGE-SHIELD — the heater shield of a crest: a flat top, straight
     sides that curve to a point at the bottom, a chevron across the
     middle in the second colour, and the page's word in the chief above
     it (PRESS-TABLE-PLAN.md Appendix D: tags award, fantasy; a text part,
     so it is always live — ADDING.md §1.2). Layers: halo shadow body line
     highlight detail text.

     THE SHIELD is x 12..116 and y 16..122: a flat top 104 wide, sides
     straight down to y 58, then two cubics (controls 116,92 and 92,112 on
     the right, mirrored on the left) meeting at the point (64,122). 104
     wide because the word wants the full chief; 106 tall because the
     halo's 3 under the point reaches 125 and the shadow's 3 the same, and
     both stay inside the box. Straight sides to 58 — 40 % of the height —
     is the heater's proportion: shorter and it is a round badge, longer
     and it is a tombstone. The one path is the halo's stroke, the shadow,
     the body and the line.

     THE CHEVRON is the heraldic one, an inverted V rising 1 in 2 from
     both sides to a peak at (64,58), 14 deep at the peak (its underside at
     72); its arms run to the shield's sides, where each end is cut by a
     chord of the side curve half a unit inside it — the side meets the
     top edge at (111.5,81.7) and the underside at (105.5,92.7), the ends
     are written at 110.5 / 104.5 — so the line layer's 3-wide outline
     covers the join and nothing of the chevron shows past the rim. It is
     {{ skSecondary }} on a {{ skPrimary }} field: the two materials every
     sticker in the kit has. Its two edges are line-layer strokes; its end
     cuts are not, since they lie under the outline.

     THE TEXT sits in the chief at font-size 16, baseline 47: five
     capitals at Sora 700 are about 58 wide, on a chief 104 wide; the caps
     stand 35..47, eleven above the chevron's peak and nineteen under the
     top edge, so the word floats a little high, as a crest's motto does.

     THE SHADOW is the silhouette 3 down-right in {{ skShadow }}, the
     least the contract allows so its rim stays inside a 6-wide halo.

     THE HIGHLIGHT is one glint in the top-left corner of the field, an
     ellipse 5.5 × 2 turned −40° at (27,28) and a dot of radius 1.8 at
     (36.5,24.5) — inside the detail's inner border (which turns at
     17,21), so the glint is a shine on the field and not a smudge on the
     rim, and clear of the word, which starts at about x 35 and y 35. THE
     DETAIL is a second outline
     5 inside the first at 1.5 — the double border a badge has — drawn
     over the chevron's ends, the way a rim sits over a field. -->
<sc-if value="{{ isBadgeShield }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M12,16 L116,16 L116,58 C116,92 92,112 64,122 C36,112 12,92 12,58 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M12,16 L116,16 L116,58 C116,92 92,112 64,122 C36,112 12,92 12,58 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M12,16 L116,16 L116,58 C116,92 92,112 64,122 C36,112 12,92 12,58 Z" fill="{{ skPrimary }}"></path>
      <path d="M64,58 L110.5,81.5 L104.5,92.5 L64,72 L23.5,92.5 L17.5,81.5 Z" fill="{{ skSecondary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M12,16 L116,16 L116,58 C116,92 92,112 64,122 C36,112 12,92 12,58 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M17.5,81.5 L64,58 L110.5,81.5 M23.5,92.5 L64,72 L104.5,92.5" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="27" cy="28" rx="5.5" ry="2" transform="rotate(-40 27 28)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="36.5" cy="24.5" r="1.8" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <path d="M17,21 L111,21 L111,58 C111,88 90,106 64,116 C38,106 17,88 17,58 Z" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linejoin="round"></path>
    </g>
    <g data-layer="text">
      <text x="64" y="47" font-size="16" text-anchor="middle" style="font-family:var(--display),sans-serif;font-weight:700" fill="{{ skInk }}">{{ skText }}</text>
    </g>
  </svg>
</sc-if>
