<!-- CRESCENT — the crescent moon with one small star in its hollow, the
     night-sky sticker (PRESS-TABLE-PLAN.md Appendix D: tags moon, night,
     fantasy). Layers: halo shadow body line highlight detail.

     THE MOON is one circle less another: the outer circle at (60,66) with
     radius 52 — 8..112 across, 14..118 down, the most the box takes once
     the halo's 3 outside is counted — and the bite taken out of it by a
     circle at (82,52) with radius 44, up and to the right, so the moon
     opens toward the upper right and its belly hangs lower left. The two
     circles cross at (59.8,14) and (107,88.2): those are the horns, and
     the path is the outer circle's long arc from one to the other round
     the left, then the bite's long arc back. The belly is 34 thick at its
     widest — a fat, chunky crescent that stays a moon at 40 px, where a
     thin one becomes a bracket. The same path is the halo's stroke, the
     shadow, the body and the line, so halo and shadow are the silhouette
     exactly.

     THE STAR sits in the hollow at (100,42) — a five-point star with tips
     at 13 and inner corners at 5.5, the 0.42 ratio a chunky sticker star
     wants — in skSecondary, the second colour against the moon's first,
     with its own halo, shadow and outline; its nearest tip stays 10 clear
     of the moon's inner edge. Without it the drawing sits in the left
     two-thirds of the box; with it the box is 8..113 across and the moon
     and star together are the whole motif.

     THE SHADOW is both shapes moved 3 down and right, the least the
     contract's 3–4 allows, so that with the halo ON the shadow's rim stays
     inside the paper edge on the diagonal: a sliver down the belly's
     lower-right and under the lower horn, the cel shade.

     THE HIGHLIGHT is one glint on the belly's upper-left — an ellipse
     9 × 3.5 at (37,26), 6 in from the outer edge at −120°, tilted −30° to
     lie along it — and a dot of radius 2.5 at (25,42), 10 in from the
     edge further round.

     THE DETAIL is three craters — circles of radius 5, 3.5 and 4 at
     (30,60), (26,84) and (44,102), each 8 or more clear of both edges —
     at stroke 1.5, half the default line. A simple style drops them and
     the moon is still the moon. -->
<sc-if value="{{ isCrescent }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M59.8,14 A52,52 0 1 0 107,88.2 A44,44 0 1 1 59.8,14 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M100,29 L103.2,37.6 L112.4,38 L105.2,43.7 L107.6,52.5 L100,47.5 L92.4,52.5 L94.8,43.7 L87.6,38 L96.8,37.6 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M59.8,14 A52,52 0 1 0 107,88.2 A44,44 0 1 1 59.8,14 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M100,29 L103.2,37.6 L112.4,38 L105.2,43.7 L107.6,52.5 L100,47.5 L92.4,52.5 L94.8,43.7 L87.6,38 L96.8,37.6 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M59.8,14 A52,52 0 1 0 107,88.2 A44,44 0 1 1 59.8,14 Z" fill="{{ skPrimary }}"></path>
      <path d="M100,29 L103.2,37.6 L112.4,38 L105.2,43.7 L107.6,52.5 L100,47.5 L92.4,52.5 L94.8,43.7 L87.6,38 L96.8,37.6 Z" fill="{{ skSecondary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M59.8,14 A52,52 0 1 0 107,88.2 A44,44 0 1 1 59.8,14 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M100,29 L103.2,37.6 L112.4,38 L105.2,43.7 L107.6,52.5 L100,47.5 L92.4,52.5 L94.8,43.7 L87.6,38 L96.8,37.6 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="37" cy="26" rx="9" ry="3.5" transform="rotate(-30 37 26)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="25" cy="42" r="2.5" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <circle cx="30" cy="60" r="5" fill="none" stroke="{{ skInk }}" stroke-width="1.5"></circle>
      <circle cx="26" cy="84" r="3.5" fill="none" stroke="{{ skInk }}" stroke-width="1.5"></circle>
      <circle cx="44" cy="102" r="4" fill="none" stroke="{{ skInk }}" stroke-width="1.5"></circle>
    </g>
  </svg>
</sc-if>
