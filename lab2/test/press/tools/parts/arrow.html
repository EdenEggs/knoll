<!-- ARROW — the bendy arrow, a fat shaft that sweeps up from the bottom-left
     and points to the right, the "look here" sticker (PRESS-TABLE-PLAN.md
     Appendix D: tag pointer). Layers: halo shadow body line highlight detail.

     THE SHAFT is a quarter of a ring about the point (83,110): outer radius
     74, inner radius 52, so the band is 22 wide — four fingers of colour at
     40 px, where a 3-unit line either side still leaves a shaft and not a
     stroke. The tail is cut flat along y=110, the ring's own diameter, so
     the arrow starts where the sticker ends: nothing is left dangling. Its
     top lands at x=83 with the band spanning y 36–58, and the HEAD sits on
     that: barbs at y=20 and y=74 (14 out past the band on each side — an
     arrowhead reads by its barbs, and 14 is the least that stays a head
     after the halo rounds it) and the tip at (119,47), the band's centre
     line carried right. Nothing reaches left of x=9 (the outer radius from
     83) or right of 119, above 20 or below 110, so with the halo's 3 the
     ink lies within 6…122 — the shadow's 6/7 is the only thing that leaves
     the box. 110 wide, 90 tall: 86 % × 70 %, centred on (64,65). The same path is the halo's
     stroke, the shadow, the body and the line, which is what keeps them
     one silhouette.

     THE SHADOW is that silhouette 3 units down and right in skShadow — the
     least the contract's 3–4 allows, so that with the halo ON its rim still
     clears the paper edge at the tip.

     THE HIGHLIGHT is one glint on the outside of the bend, where a curved
     sticker catches the light: an ellipse 9 × 3.5 at (36,63), the point on
     radius 66 (8 inside the outer edge) at 45° up-left of the ring's centre,
     turned −45° so it lies along the curve, and a dot of radius 2.5 a little
     further round.

     THE DETAIL is the shaft's centre line, radius 63 from the same centre,
     dashed 4 on 5 at stroke 1.5 (half the default line): the "motion" a
     cartoon arrow has, and the first thing a plain style may drop. -->
<sc-if value="{{ isArrow }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M9,110 A74,74 0 0 1 83,36 L83,20 L119,47 L83,74 L83,58 A52,52 0 0 0 31,110 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M9,110 A74,74 0 0 1 83,36 L83,20 L119,47 L83,74 L83,58 A52,52 0 0 0 31,110 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M9,110 A74,74 0 0 1 83,36 L83,20 L119,47 L83,74 L83,58 A52,52 0 0 0 31,110 Z" fill="{{ skPrimary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M9,110 A74,74 0 0 1 83,36 L83,20 L119,47 L83,74 L83,58 A52,52 0 0 0 31,110 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="36" cy="63" rx="9" ry="3.5" transform="rotate(-45 36 63)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="49" cy="51" r="2.5" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <path d="M20,110 A63,63 0 0 1 83,47" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"></path>
    </g>
  </svg>
</sc-if>
