<!-- BUBBLE-SPEECH — the comic speech bubble: a plump rounded box with a
     tail to the bottom-left, and the page's words inside it
     (PRESS-TABLE-PLAN.md Appendix D: tag comic; a text slot, so this part
     is always live — ADDING.md §1.2). Layers: halo shadow body line
     highlight detail text.

     IT BOBS, NOT SWAYS: the root animation is sk-bob, because a bubble
     hangs in the air above its speaker and a lean would tip the words with
     it; the forest's signpost bobs for the same reason.

     THE SILHOUETTE is a box x 8–120, y 14–92 with corners of radius 18 —
     a fixed radius rather than {{ skRadius }} because this is a path, not
     a rect, and a bubble that went square-cornered under a low-corners
     style would stop being a bubble — and a TAIL from the box's bottom
     edge, 24 wide at the root (x 34–58), to a tip at (20,116): its right
     edge a cubic that bows outward the way a drawn tail does, its left
     edge straight. 112 wide, 102 tall: 88 % × 80 % of the box, the halo's
     3 keeping inside 5…123. The one path is the halo's stroke, the shadow,
     the body's rim and the line.

     THE BODY is two fills: the silhouette in skPrimary, and over it the
     FACE, the same shape inset 8 (x 16–112, y 22–84, corners of 12, a tail
     from x 46–56 to a tip at (38,98)) in skPaper — so the bubble is a
     coloured rim round a paper face, the words in skInk sit on paper the
     way words do, and the rim gives the glint somewhere to shine. The
     face's tail is drawn narrower than the rim's so the rim stays about
     6–8 wide down the tail's left side and thickens at the tip, as an
     inked tail does.

     THE SHADOW is the silhouette 3 down and right in skShadow, the least
     the contract allows, so the halo's rim clears the paper at the tail.

     THE HIGHLIGHT is one glint in the top rim: an ellipse 8 × 2.2 at
     (30,18) — the rim there runs y 14–22 and the glint sits in its middle
     — and a dot of radius 2 further along at (46,18).

     THE DETAIL is the face's own outline at stroke 1.5, the double line a
     drawn bubble has; a plain style drops it and the rim still shows.

     THE TEXT is one <text> at (64,61): the face is y 22–84, centre 53, and
     a 22-unit bold display face has a cap height near 16, so the baseline
     8 below centre sets the word on the middle; 22 units fits five capitals
     in the 96-wide face with margin either side. -->
<sc-if value="{{ isBubbleSpeech }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-bob 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M26,14 L102,14 A18,18 0 0 1 120,32 L120,74 A18,18 0 0 1 102,92 L58,92 C46,100 30,108 20,116 L34,92 L26,92 A18,18 0 0 1 8,74 L8,32 A18,18 0 0 1 26,14 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M26,14 L102,14 A18,18 0 0 1 120,32 L120,74 A18,18 0 0 1 102,92 L58,92 C46,100 30,108 20,116 L34,92 L26,92 A18,18 0 0 1 8,74 L8,32 A18,18 0 0 1 26,14 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M26,14 L102,14 A18,18 0 0 1 120,32 L120,74 A18,18 0 0 1 102,92 L58,92 C46,100 30,108 20,116 L34,92 L26,92 A18,18 0 0 1 8,74 L8,32 A18,18 0 0 1 26,14 Z" fill="{{ skPrimary }}"></path>
      <path d="M28,22 L100,22 A12,12 0 0 1 112,34 L112,72 A12,12 0 0 1 100,84 L56,84 C48,89 42,93 38,98 L46,84 L28,84 A12,12 0 0 1 16,72 L16,34 A12,12 0 0 1 28,22 Z" fill="{{ skPaper }}"></path>
    </g>
    <g data-layer="line">
      <path d="M26,14 L102,14 A18,18 0 0 1 120,32 L120,74 A18,18 0 0 1 102,92 L58,92 C46,100 30,108 20,116 L34,92 L26,92 A18,18 0 0 1 8,74 L8,32 A18,18 0 0 1 26,14 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="30" cy="18" rx="8" ry="2.2" fill="{{ skHighlight }}"></ellipse>
      <circle cx="46" cy="18" r="2" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <path d="M28,22 L100,22 A12,12 0 0 1 112,34 L112,72 A12,12 0 0 1 100,84 L56,84 C48,89 42,93 38,98 L46,84 L28,84 A12,12 0 0 1 16,72 L16,34 A12,12 0 0 1 28,22 Z" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="text">
      <text x="64" y="61" font-size="22" text-anchor="middle" style="font-family:var(--display),sans-serif;font-weight:700" fill="{{ skInk }}">{{ skText }}</text>
    </g>
  </svg>
</sc-if>
