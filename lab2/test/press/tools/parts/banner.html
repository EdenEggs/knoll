<!-- BANNER — the ribbon banner: a bowed face carrying the text slot, two
     swallow-tailed tails behind it, and the two folds where the ribbon
     wraps from the tails to the face (PRESS-TABLE-PLAN.md Appendix D: tags
     title, hype; a text part). Layers: halo shadow body line highlight
     detail text.

     THE FACE is 84 wide (x 22..106) and 48 tall (y 36..84), bowed 6 at the
     middle of its top and bottom edges — a straight rectangle reads as a
     label, a bowed one as cloth. Its fill is {{ skPrimary }} so the banner
     is the sticker colour; the tails and the folds are {{ skSecondary }},
     the second material, which is what makes the folds read as folds even
     in a flat style with no shading. The tails are 48 tall too, hung 10
     lower than the face (y 46..94), out to x 4 and 124 — a halo of 3 on
     top of that reaches 1 and 127 — with a swallowtail notch 9 deep, the
     least that still reads as a notch at 40 px. Each fold is the triangle
     between the face's bottom corner and the tail's bottom edge (rise and
     run 14, hidden above the face's bottom curve, so what shows is the
     wedge under the corner with its crease from about (31,85) down to
     (22,94)); the tails are L-shaped so that nothing of a tail shows past
     that crease. Five shapes make the silhouette — the halo strokes each
     and the shadow offsets each by 3 (the least the contract allows, so the
     shadow's rim stays inside a 6-wide halo) — and every inside edge falls
     under the body, so the union is the die-cut.

     THE TEXT sits on the face's centre line at font-size 20: at Sora 700
     five capitals are about 72 wide, which leaves 6 either side of the
     face, and the baseline at 67 puts a 14-unit cap height on the face's
     centre (60). A longer word overflows the face — the plan keeps text
     slots to a word or two (§3.6).

     THE HIGHLIGHT is one glint on the face's upper left (the burst's
     corner), an 8 × 2.4 ellipse and a dot; THE DETAIL is a dashed stitch
     4 inside the top and bottom edges of the face at 1.5, the half weight,
     and not down the sides, where it would crowd the word. -->
<sc-if value="{{ isBanner }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M30,46 L4,46 L13,70 L4,94 L22,94 L22,84 L30,84 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M98,46 L124,46 L115,70 L124,94 L106,94 L106,84 L98,84 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M22,80 L36,80 L22,94 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M106,80 L92,80 L106,94 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M22,36 Q64,30 106,36 L106,84 Q64,90 22,84 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M30,46 L4,46 L13,70 L4,94 L22,94 L22,84 L30,84 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M98,46 L124,46 L115,70 L124,94 L106,94 L106,84 L98,84 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M22,80 L36,80 L22,94 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M106,80 L92,80 L106,94 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M22,36 Q64,30 106,36 L106,84 Q64,90 22,84 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M30,46 L4,46 L13,70 L4,94 L22,94 L22,84 L30,84 Z" fill="{{ skSecondary }}"></path>
      <path d="M98,46 L124,46 L115,70 L124,94 L106,94 L106,84 L98,84 Z" fill="{{ skSecondary }}"></path>
      <path d="M22,80 L36,80 L22,94 Z" fill="{{ skSecondary }}"></path>
      <path d="M106,80 L92,80 L106,94 Z" fill="{{ skSecondary }}"></path>
      <path d="M22,36 Q64,30 106,36 L106,84 Q64,90 22,84 Z" fill="{{ skPrimary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M22,46 L4,46 L13,70 L4,94 L22,94 L22,84 M22,94 L31,85" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M106,46 L124,46 L115,70 L124,94 L106,94 L106,84 M106,94 L97,85" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M22,36 Q64,30 106,36 L106,84 Q64,90 22,84 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="37" cy="44" rx="8" ry="2.4" transform="rotate(-6 37 44)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="50" cy="42.5" r="2.2" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <path d="M26,40 Q64,34 102,40 M26,80 Q64,86 102,80" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4.5"></path>
    </g>
    <g data-layer="text">
      <text x="64" y="67" font-size="20" text-anchor="middle" style="font-family:var(--display),sans-serif;font-weight:700" fill="{{ skInk }}">{{ skText }}</text>
    </g>
  </svg>
</sc-if>
