<!-- PIN — a pushpin, the round-headed drawing pin, seen from above and to
     one side so the needle shows, pushed into the page on a tilt
     (PRESS-TABLE-PLAN.md Appendix D: tags scrapbook). Layers: halo shadow
     body line highlight detail.

     IT BOBS, not sways: sk-bob, because a pin hangs in the page by its
     point and a skew would bend the needle; the sheet's note says a part
     that hangs rather than stands says so, and this one does.

     THE PIN is drawn upright in its own frame, origin at the centre of the
     head's top face, and then turned 35° and moved so its ink is centred:
     a head (an ellipse 60 × 32, the top face, over a 10-deep side wall
     with the same curve), a neck 22 wide from the head down to the base,
     a base (an ellipse 46 × 16 with a 6-deep side), and a needle 6 wide at
     the base tapering to a point 44 below it. Upright the pin is 112 tall
     and 60 wide; turned 35° its ink box is about 81 × 100, head to the
     upper right, point to the lower left, the way a pin sits in a
     corkboard photograph. 35° because at 30° the pin is a narrow column
     and at 45° the head's face closes to a sliver; the translate (78.5,
     35.5) is the offset that puts that box's centre on 64, 64.

     THE HEAD, NECK AND BASE are {{ skPrimary }} (one piece of plastic);
     THE NEEDLE is {{ skSecondary }} (the other material, and a role that
     stays visible on a dark paper where skPaper would not). Every fill is
     stroked in the line layer, and where a piece meets the one above it —
     the neck under the head's side, the neck on the base's top, the
     needle under the base's side — the outline is an open path that stops
     at the join, so no edge is drawn across a face: the neck's sides run
     from y 14 (under the head's rim at x ±11, which curves down to
     y 23.5) to 36.8, where the base's top ellipse crosses x ±11; the
     base's top outline is the ellipse less its arc behind the neck; the
     needle's sides start at y 58, the base side's lowest point, where the
     needle is 5.2 wide.

     THE SHADOW is the whole silhouette moved 3 down and right.

     THE HIGHLIGHT is the one glint: an ellipse 20 × 7 tilted −20° on the
     upper left of the head's face, and a dot of radius 2.5 beside it.

     THE DETAIL is two short ridges on the head's side wall, stroke 1.5,
     at x ±16 from y 15 to 22 — the moulding of the plastic, gone in a
     simple style. -->
<sc-if value="{{ isPin }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-bob 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <g transform="translate(78.5 35.5) rotate(35)">
        <path d="M-3,52 L3,52 L0,96 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
        <path d="M-23,44 A23,8 0 0 0 23,44 L23,50 A23,8 0 0 1 -23,50 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
        <ellipse cx="0" cy="44" rx="23" ry="8" fill="none" stroke="{{ skPaper }}" stroke-width="6"></ellipse>
        <path d="M-11,10 L11,10 L11,44 L-11,44 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
        <path d="M-30,0 A30,16 0 0 0 30,0 L30,10 A30,16 0 0 1 -30,10 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
        <ellipse cx="0" cy="0" rx="30" ry="16" fill="none" stroke="{{ skPaper }}" stroke-width="6"></ellipse>
      </g>
    </g>
    <g data-layer="shadow">
      <g transform="translate(81.5 38.5) rotate(35)">
        <path d="M-3,52 L3,52 L0,96 Z" fill="{{ skShadow }}"></path>
        <path d="M-23,44 A23,8 0 0 0 23,44 L23,50 A23,8 0 0 1 -23,50 Z" fill="{{ skShadow }}"></path>
        <ellipse cx="0" cy="44" rx="23" ry="8" fill="{{ skShadow }}"></ellipse>
        <path d="M-11,10 L11,10 L11,44 L-11,44 Z" fill="{{ skShadow }}"></path>
        <path d="M-30,0 A30,16 0 0 0 30,0 L30,10 A30,16 0 0 1 -30,10 Z" fill="{{ skShadow }}"></path>
        <ellipse cx="0" cy="0" rx="30" ry="16" fill="{{ skShadow }}"></ellipse>
      </g>
    </g>
    <g data-layer="body">
      <g transform="translate(78.5 35.5) rotate(35)">
        <path d="M-3,52 L3,52 L0,96 Z" fill="{{ skSecondary }}"></path>
        <path d="M-23,44 A23,8 0 0 0 23,44 L23,50 A23,8 0 0 1 -23,50 Z" fill="{{ skPrimary }}"></path>
        <ellipse cx="0" cy="44" rx="23" ry="8" fill="{{ skPrimary }}"></ellipse>
        <path d="M-11,10 L11,10 L11,44 L-11,44 Z" fill="{{ skPrimary }}"></path>
        <path d="M-30,0 A30,16 0 0 0 30,0 L30,10 A30,16 0 0 1 -30,10 Z" fill="{{ skPrimary }}"></path>
        <ellipse cx="0" cy="0" rx="30" ry="16" fill="{{ skPrimary }}"></ellipse>
      </g>
    </g>
    <g data-layer="line">
      <g transform="translate(78.5 35.5) rotate(35)">
        <path d="M-2.6,58 L0,96 L2.6,58" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M-23,44 L-23,50 A23,8 0 0 0 23,50 L23,44" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M-11,36.8 A23,8 0 0 0 -23,44 A23,8 0 0 0 23,44 A23,8 0 0 0 11,36.8" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M-11,14 L-11,36.8 M11,14 L11,36.8" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M-30,0 L-30,10 A30,16 0 0 0 30,10 L30,0" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <ellipse cx="0" cy="0" rx="30" ry="16" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></ellipse>
      </g>
    </g>
    <g data-layer="highlight">
      <g transform="translate(78.5 35.5) rotate(35)">
        <ellipse cx="-11" cy="-6" rx="10" ry="3.5" transform="rotate(-20 -11 -6)" fill="{{ skHighlight }}"></ellipse>
        <circle cx="-23" cy="0" r="2.5" fill="{{ skHighlight }}"></circle>
      </g>
    </g>
    <g data-layer="detail">
      <g transform="translate(78.5 35.5) rotate(35)">
        <path d="M-16,15 L-16,22 M16,15 L16,22" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linecap="round"></path>
      </g>
    </g>
  </svg>
</sc-if>
