<!-- BOLT — the lightning bolt, the "energy" sticker (PRESS-TABLE-PLAN.md
     Appendix D: tags hype, storm, energy — storm is a motif the vision
     call matches). Layers: halo shadow body line highlight detail.

     THE BOLT is the seven-point polygon every comic draws: a flat top 26
     wide at y 6, the upper arm dropping left to an elbow at (24,72), a step
     in to (58,72), the lower arm falling to the point at (44,122), and the
     long right edge back up to the right elbow at (104,50) and the notch
     at (70,50). 24..104 wide and 6..122 tall — the height is the box, the
     width 63 % of it, the lean is what makes it a strike and not a Z. The
     arms are 34 units across at the elbows, thick enough that the three
     strokes (halo, body edge, line) leave a wide band of colour at 40 px.
     One path, drawn four times (halo stroke, shadow, body, line), so the
     die-cut edge and the cel shade are the silhouette exactly.

     THE SHADOW is the silhouette moved 3 down and right, the least the
     contract allows (burst says why: with the halo on, the shadow's rim
     stays inside the paper edge on the diagonal).

     THE HIGHLIGHT is one glint on the upper arm, an ellipse 11 × 3.5 turned
     −57.5° to lie along the arm's left edge (the edge from (66,6) to
     (24,72) runs at that angle) and set 6.9 units inside it, so its far
     side clears the outline's inner 1.5 by two units of body; and a dot of
     radius 2.5 under the flat top.

     THE DETAIL is one 1.5 stroke (half the default line) inside the lower
     arm from (84,64) to (62,92), parallel to the long right edge — the
     speed line. A simple style drops it and the bolt is still the bolt. -->
<sc-if value="{{ isBolt }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M66,6 L92,6 L70,50 L104,50 L44,122 L58,72 L24,72 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M66,6 L92,6 L70,50 L104,50 L44,122 L58,72 L24,72 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M66,6 L92,6 L70,50 L104,50 L44,122 L58,72 L24,72 Z" fill="{{ skPrimary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M66,6 L92,6 L70,50 L104,50 L44,122 L58,72 L24,72 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="57" cy="33" rx="11" ry="3.5" transform="rotate(-57.5 57 33)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="68" cy="15" r="2.5" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <path d="M84,64 L62,92" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linecap="round"></path>
    </g>
  </svg>
</sc-if>
