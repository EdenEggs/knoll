<!-- LEAF-SPRIG — a stalk with five leaves, two pairs and one at the tip,
     the bit of green a cozy page tucks in a corner (PRESS-TABLE-PLAN.md
     Appendix D: tags leaf, cozy, nature). Layers: halo shadow body line
     highlight detail.

     THE STALK is a quadratic from the foot at (50,120) through a control
     at (56,72) to the tip at (82,40): it stands nearly straight at the
     foot and leans right by the top, the way a cut sprig sits in a jar.
     It is drawn as a filled shape in skSecondary, not as an ink stroke,
     so it keeps its colour when a style hides the line layer: 8 wide at
     the foot narrowing to 5 at the tip, which leaves 5 and then 2 of
     colour inside the default 3 stroke — thin at the top, but the tip
     leaf takes over there.

     THE LEAVES hang off the stalk at 0.16, 0.38, 0.58 and 0.78 of its
     length, left, right, left, right, at 60° (the middle pair 58°) from
     the stalk's direction there — the angle at which the pairs read as
     leaves and not a herringbone — and the fifth carries straight on
     from the tip. They are 42, 44, 36, 34 and 32 long and 24, 23, 20, 19
     and 18 wide, the lower ones bigger, as on the real thing. Each is two
     quadratics from base to tip with a control a full width out on
     either side, which puts the leaf's widest at half the control's
     offset, so the numbers above are the widths you see. Bodies are
     skPrimary, drawn after the stalk so each leaf sits on it; the box is
     20.9..105.5 across and 15.2..120.5 down, 66 % × 82 % — a sprig is
     taller than it is wide — and with the halo's 3 outside it reaches
     17.9 and 123.5. The halo strokes every shape and the shadow copies
     every shape, and since both sit under the body the union is the
     die-cut edge either way.

     THE SHADOW is every shape moved 3 down and right, the least the
     contract's 3–4 allows, so that with the halo ON the shadow's rim
     stays inside the paper edge on the diagonal: a sliver down the right
     of each leaf and the stalk, the cel shade.

     THE HIGHLIGHT is one glint on the big lower-left leaf — an ellipse
     6.5 × 2.4 at (36,85), 5 above the leaf's midline and tilted 41° to
     lie along it — and a dot of radius 2 at (55,49) on the upper-left
     leaf, both kept 2 clear of their leaf's outline.

     THE DETAIL is the five midribs, each from its leaf's base to 78 % of
     the way to the tip, at stroke 1.5, half the default line. A simple
     style drops them and the sprig is still the sprig. -->
