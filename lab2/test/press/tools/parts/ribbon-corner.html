<!-- RIBBON-CORNER — the diagonal sash a shop pins across the top-right
     corner of a picture: one band at 45°, running from the top edge down
     to the right edge, its two ends notched into swallowtails, the page's
     word along it (PRESS-TABLE-PLAN.md Appendix D: tags sale, new; a text
     part, so it is always live — ADDING.md §1.2). Layers: halo shadow body
     line highlight detail text.

     IT IS DRAWN FLAT AND TURNED: every shape is written in a frame where
     the band lies level, centred on (64,64), and each layer carries one
     <g transform="rotate(45 64 64)"> — the same numbers make the halo, the
     shadow, the body and the line, and the text rotates with the band so
     the word reads down the sash, top-left to bottom-right, the way it
     does on a corner ribbon. The shadow's group is translate(3 3) THEN the
     rotate, so its offset is 3 down-right on the page and not 3 along the
     band.

     THE BAND is 130 long (x −1..129) and 32 wide (y 48..80): turned 45°
     its four corners land at 6.7 and 121.3 on both axes, which leaves the
     halo's 3 inside 3.7…124.3 and the shadow's 3 inside 124.3 — a longer
     band clips a corner, a shorter one leaves the box empty at the
     diagonal's ends. 32 wide because the word wants a 20-unit face with
     room over and under it; the diagonal of the box is 181, so 130 of
     band still shows a triangle of page at each side, which is what says
     "sash" and not "square". Each end is notched 9 deep (the banner's
     notch, the least that reads at 40 px), and the last 18 of each end —
     x −1..17 and 111..129, the notch and a little more — is a TAIL in
     {{ skSecondary }}, so the ribbon has the banner's two materials and a
     crease at each tail (the two verticals in the line layer). The face
     between the tails is 94 long; at Sora 700 five capitals are about 72
     wide at font-size 20, which leaves 11 either side.

     THE SHADOW is the silhouette 3 down-right in {{ skShadow }}; under a
     45° band it shows along the lower-right edge and the lower tail's
     notch — the cel shade.

     THE HIGHLIGHT is one glint in the face's upper-left corner, an
     ellipse 7 × 2.2 and a dot of radius 2, at the mirror of the shadow's
     corner. THE DETAIL is a dashed stitch 4 inside the band's two long
     edges at 1.5, the half weight, the same 3 4.5 dash the banner uses,
     stopped 6 short of each crease (x 23..105) so the last dash does not
     run into it; not across the tails, where it would crowd the crease. -->
<sc-if value="{{ isRibbonCorner }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <g transform="rotate(45 64 64)">
        <path d="M-1,48 L129,48 L120,64 L129,80 L-1,80 L8,64 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      </g>
    </g>
    <g data-layer="shadow">
      <g transform="translate(3 3) rotate(45 64 64)">
        <path d="M-1,48 L129,48 L120,64 L129,80 L-1,80 L8,64 Z" fill="{{ skShadow }}"></path>
      </g>
    </g>
    <g data-layer="body">
      <g transform="rotate(45 64 64)">
        <path d="M-1,48 L129,48 L120,64 L129,80 L-1,80 L8,64 Z" fill="{{ skSecondary }}"></path>
        <rect x="17" y="48" width="94" height="32" fill="{{ skPrimary }}"></rect>
      </g>
    </g>
    <g data-layer="line">
      <g transform="rotate(45 64 64)">
        <path d="M-1,48 L129,48 L120,64 L129,80 L-1,80 L8,64 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M17,48 L17,80 M111,48 L111,80" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      </g>
    </g>
    <g data-layer="highlight">
      <g transform="rotate(45 64 64)">
        <ellipse cx="27" cy="54" rx="7" ry="2.2" fill="{{ skHighlight }}"></ellipse>
        <circle cx="39" cy="53.5" r="2" fill="{{ skHighlight }}"></circle>
      </g>
    </g>
    <g data-layer="detail">
      <g transform="rotate(45 64 64)">
        <path d="M23,52 L105,52 M23,76 L105,76" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4.5"></path>
      </g>
    </g>
    <g data-layer="text">
      <text x="64" y="71" font-size="20" text-anchor="middle" transform="rotate(45 64 64)" style="font-family:var(--display),sans-serif;font-weight:700" fill="{{ skInk }}">{{ skText }}</text>
    </g>
  </svg>
</sc-if>
