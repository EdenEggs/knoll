<!-- SPARKLE — the four-point sparkle cluster, the glint that means magic
     (PRESS-TABLE-PLAN.md Appendix D: tags sparkle, magic — the motif the
     vision call matches). Layers: halo shadow body line highlight detail.
     Three silhouettes in every layer, never joined, so each sparkle gets its
     own halo and shadow and the paper between them is what makes a cluster.

     A SPARKLE is four tips joined by four quadratic curves that bow inward,
     the control point of each on the diagonal at 0.18 of the tip radius —
     six commands a silhouette. 0.18 is the fat setting: at 0.1 the arms are
     needles that vanish at 40 px, at 0.25 it is a rounded diamond and not a
     sparkle any more. The big one tips at 44, centred at (50,66), low-left
     where the weight sits; the middle one tips at 22 at (96,32), up in the
     corner; the small one tips at 14 at (98,94) below it, at 0.2 because a
     tiny sparkle needs fatter arms to keep any body at all. Their outer box
     is 6..118 across and 10..110 down; with the halo's 3 the left edge is 3
     and the right 121, nothing spills.

     THE COLOURS: big and small in the primary, the middle one in the
     secondary — the same split stars-3 makes, so the two sprinkle parts sit
     together on a sheet.

     THE SHADOW is each silhouette moved 3 down and right — the least the
     contract's 3–4 allows, so that with the halo on the shadow's rim stays
     inside the paper edge on the diagonal.

     THE HIGHLIGHT is one glint on the big sparkle's upper-left shoulder —
     the web between its top arm and its left arm — because the arm has no
     room for it: the top arm is 8.6 wide at y 35 and 14.6 at y 41, and the
     first render put a 2.5 × 4.5 glint beside the detail's tip, where it
     lay on the detail line. The shoulder has room: at the middle of the
     concave edge the outer curve is 21.1 from the sparkle's centre along
     the diagonal and the detail's curve 9.6, and between the line's inner
     edge (19.6) and the detail's stroke (10.35) there are 9.25 units of
     clean body. The glint is an ellipse 6 × 2.4 tilted −45°, along the
     shoulder, centred at (39.4,55.4) — 15 along the diagonal, the middle of
     that band — 2.2 clear of the line and 2.25 clear of the detail. The dot
     of radius 2 at (50,38) is higher up the top arm, where the arm is 11.4
     wide and the dot 2.2 clear of the line on both sides.

     THE DETAIL is the big sparkle again at tip radius 20 at stroke 1.5, half
     the default line: the inner echo a printed sparkle has. A simple style
     drops it. -->
<sc-if value="{{ isSparkle }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-sway 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <path d="M50,22 Q57.9,58.1 94,66 Q57.9,73.9 50,110 Q42.1,73.9 6,66 Q42.1,58.1 50,22 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M96,10 Q100,28 118,32 Q100,36 96,54 Q92,36 74,32 Q92,28 96,10 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M98,80 Q100.8,91.2 112,94 Q100.8,96.8 98,108 Q95.2,96.8 84,94 Q95.2,91.2 98,80 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
    </g>
    <g data-layer="shadow">
      <path d="M50,22 Q57.9,58.1 94,66 Q57.9,73.9 50,110 Q42.1,73.9 6,66 Q42.1,58.1 50,22 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M96,10 Q100,28 118,32 Q100,36 96,54 Q92,36 74,32 Q92,28 96,10 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
      <path d="M98,80 Q100.8,91.2 112,94 Q100.8,96.8 98,108 Q95.2,96.8 84,94 Q95.2,91.2 98,80 Z" transform="translate(3 3)" fill="{{ skShadow }}"></path>
    </g>
    <g data-layer="body">
      <path d="M50,22 Q57.9,58.1 94,66 Q57.9,73.9 50,110 Q42.1,73.9 6,66 Q42.1,58.1 50,22 Z" fill="{{ skPrimary }}"></path>
      <path d="M96,10 Q100,28 118,32 Q100,36 96,54 Q92,36 74,32 Q92,28 96,10 Z" fill="{{ skSecondary }}"></path>
      <path d="M98,80 Q100.8,91.2 112,94 Q100.8,96.8 98,108 Q95.2,96.8 84,94 Q95.2,91.2 98,80 Z" fill="{{ skPrimary }}"></path>
    </g>
    <g data-layer="line">
      <path d="M50,22 Q57.9,58.1 94,66 Q57.9,73.9 50,110 Q42.1,73.9 6,66 Q42.1,58.1 50,22 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M96,10 Q100,28 118,32 Q100,36 96,54 Q92,36 74,32 Q92,28 96,10 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M98,80 Q100.8,91.2 112,94 Q100.8,96.8 98,108 Q95.2,96.8 84,94 Q95.2,91.2 98,80 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
    <g data-layer="highlight">
      <ellipse cx="39.4" cy="55.4" rx="6" ry="2.4" transform="rotate(-45 39.4 55.4)" fill="{{ skHighlight }}"></ellipse>
      <circle cx="50" cy="38" r="2" fill="{{ skHighlight }}"></circle>
    </g>
    <g data-layer="detail">
      <path d="M50,46 Q53.6,62.4 70,66 Q53.6,69.6 50,86 Q46.4,69.6 30,66 Q46.4,62.4 50,46 Z" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path>
    </g>
  </svg>
</sc-if>
