<!-- TAG-PRICE — the price tag: a luggage tag, pointed at one end with an
     eyelet through the point and a loop of string knotted to it, hanging
     on a tilt, the page's word (a price, say) on its face
     (PRESS-TABLE-PLAN.md Appendix D: tags store; a text part, so it is
     always live — ADDING.md §1.2). Layers: halo shadow body line highlight
     detail text. It is the tag shape tag-new, tag-soon and tag-wishlist
     share, with a text slot where they carry a word drawn in paths: the
     pentagon, the eyelet, the string and the 20° below are the shape;
     copy them.

     IT BOBS, NOT SWAYS: sk-bob, because a tag hangs from its string, and
     a skew would bend the string where a bob swings the tag on it — the
     sheet's rule for a part that hangs rather than stands.

     IT IS DRAWN LEVEL AND TURNED: every shape is written in a frame where
     the tag lies level, point to the left, and each layer carries one
     <g transform="rotate(20 64 64)"> — 20° clockwise, so the point and the
     string go up-left and the body hangs down-right, the way a tag on a
     string does. 20° because at 10° it is a label lying flat and at 30° a
     104-long tag clips the box's right edge. The shadow's group is
     translate(3 3) THEN the rotate, so its offset is 3 down-right on the
     page and not 3 along the tag.

     THE TAG is a pentagon: the point at (12,64), shoulders at (36,34) and
     (36,94), the far corners at (116,34) and (116,94) — 104 long and 60
     tall, the point's edges rising 30 over 24. Turned 20° its corners land
     between x 15 and 123, y 26 and 110; the halo's 3 past the far corner
     is 126 and the shadow's 3 the same. THE EYELET is a ring of radius 8
     in {{ skSecondary }} at (32,64), 20 in from the point, with the HOLE
     of radius 4.5 in {{ skPaper }} through it — the paper, because a die-
     cut hole shows the backing, and the halo is that same paper. The two
     rims are line-layer circles.

     THE STRING is one line-layer stroke: from the hole's left rim
     (27.5,64) straight to the point, then a teardrop loop out past it,
     two cubics that reach x 4 at their widest and come back to the point
     — turned 20° the loop's far side sits at about x 10, its line's 1.5
     and the halo's 3 beyond that still inside the box. A line has no
     silhouette, so the halo strokes the string's own path 9 wide (its 3
     plus 3 either side) and the shadow layer leaves it out: an offset
     copy of a 3-wide line is a doubled line, not a shade, and the root
     drop-shadow already lifts it.

     THE TEXT sits on the face at font-size 17, baseline 70, centred on x
     78: the face runs from the eyelet's rim at 40 to the far edge at 116,
     and five capitals at Sora 700 are about 61 wide at 17, which leaves
     7.5 either side. A price is shorter than that.

     THE SHADOW is the pentagon 3 down-right in {{ skShadow }}, the least
     the contract allows so its rim stays inside a 6-wide halo.

     THE HIGHLIGHT is one glint on the face's upper-left, an ellipse 6 × 2
     at (46,40) and a dot of radius 1.8 at (57,39.5), in the corner under
     the shoulder where the light lands. THE DETAIL is a second outline
     about 4 inside the first at 1.5, the printed border a tag has. -->
<sc-if value="{{ isTagPrice }}">
  <svg width="128" height="128" sc-camel-view-box="0 0 128 128" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(6px 7px 0 rgba(0,0,0,.3)); animation: sk-bob 4.2s ease-in-out -1.1s infinite alternate">
    <g data-layer="halo" style="display:none">
      <g transform="rotate(20 64 64)">
        <path d="M12,64 L36,34 L116,34 L116,94 L36,94 Z" fill="none" stroke="{{ skPaper }}" stroke-width="6" stroke-linejoin="round"></path>
        <path d="M27.5,64 L12,64 C3,64 1,52 8,46 C15,40 24,52 12,64" fill="none" stroke="{{ skPaper }}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path>
      </g>
    </g>
    <g data-layer="shadow">
      <g transform="translate(3 3) rotate(20 64 64)">
        <path d="M12,64 L36,34 L116,34 L116,94 L36,94 Z" fill="{{ skShadow }}"></path>
      </g>
    </g>
    <g data-layer="body">
      <g transform="rotate(20 64 64)">
        <path d="M12,64 L36,34 L116,34 L116,94 L36,94 Z" fill="{{ skPrimary }}"></path>
        <circle cx="32" cy="64" r="8" fill="{{ skSecondary }}"></circle>
        <circle cx="32" cy="64" r="4.5" fill="{{ skPaper }}"></circle>
      </g>
    </g>
    <g data-layer="line">
      <g transform="rotate(20 64 64)">
        <path d="M12,64 L36,34 L116,34 L116,94 L36,94 Z" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <circle cx="32" cy="64" r="8" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}"></circle>
        <circle cx="32" cy="64" r="4.5" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}"></circle>
        <path d="M27.5,64 L12,64 C3,64 1,52 8,46 C15,40 24,52 12,64" fill="none" stroke="{{ skInk }}" stroke-width="{{ skStroke }}" stroke-linejoin="round" stroke-linecap="round"></path>
      </g>
    </g>
    <g data-layer="highlight">
      <g transform="rotate(20 64 64)">
        <ellipse cx="46" cy="40" rx="6" ry="2" fill="{{ skHighlight }}"></ellipse>
        <circle cx="57" cy="39.5" r="1.8" fill="{{ skHighlight }}"></circle>
      </g>
    </g>
    <g data-layer="detail">
      <g transform="rotate(20 64 64)">
        <path d="M18,64 L39,38 L112,38 L112,90 L39,90 Z" fill="none" stroke="{{ skInk }}" stroke-width="1.5" stroke-linejoin="round"></path>
      </g>
    </g>
    <g data-layer="text">
      <text x="78" y="70" font-size="17" text-anchor="middle" transform="rotate(20 64 64)" style="font-family:var(--display),sans-serif;font-weight:700" fill="{{ skInk }}">{{ skText }}</text>
    </g>
  </svg>
</sc-if>
