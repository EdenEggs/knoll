<!-- STARS-3 — three scattered stars, the sprinkle that says something shone
     (PRESS-TABLE-PLAN.md Appendix D: tags sparkle). Layers: halo shadow body
     line highlight detail. Three silhouettes in every layer, never joined: on
     the sheet each star gets its own halo and its own shadow, and the gaps
     between them (about 10 units, so two halos of 3 still leave 4 of paper)
     are what make three stars and not one blob.

     THE STARS are the star part's shape — tips to inner corners at 0.46 —
     three times: the big one tips at 40, centred at (50,76), straight up,
     low-left where the weight of the sticker sits; the middle one tips at
     26 at (96,40), turned 15° so its tip leans right, up in the corner the
     eye reads to; the small one tips at 18 at (25,27), turned −20° the other
     way, the odd one out — 18 because at 16 it was a speck at 40 px, and at
     20 its foot would sit within a halo's width of the big star's tip. Two
     turns in two directions is what "scattered" is; three upright stars is
     a row. Their outer box is 7..122 across and 10..108 down: the halo's 3
     brings the left edge to 4 and the right to 125, nothing spills.

     THE COLOURS: big and small in the primary, the middle one in the
     secondary, so the cluster carries both of a page's colours — the one
     thing a sprinkle of stars can do that a single star cannot.

     THE SHADOW is each silhouette moved 3 down and right — the least the
     contract's 3–4 allows, so that with the halo on the shadow's rim stays
     inside the paper edge on the diagonal.

     THE HIGHLIGHT is one glint on the big star — an upright ellipse 2 × 4
     at (50,49), on the top arm's own axis, because that arm is only 11.2
     wide there: its edges run 23.4° off the vertical from the tip at
     (50,36), so at y 49 the body between the line's inner edges is 8.2
     wide and the glint is 2.1 clear of the line on either side and 3 above
     the inner star's tip at (50,56). (The first render laid a 5.5 × 2.2
     glint along the left edge the way the star part does; at this size its
     flank lay 0.45 from the line's ink and read as part of it.) And a dot of
     radius 2 at (99.6,26.5), on the axis of the middle star's top arm 14 out
     from its centre (96,40), 1.7 clear of the line on either side, so the
     two colours each catch a light.

     THE DETAIL is the big star again at half size (tips at 20, corners at
     9.2) at stroke 1.5, half the default line — the inner star of a badge,
     on the one star large enough to carry it. A simple style drops it. -->
