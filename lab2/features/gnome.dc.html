<style>
  body { margin: 0; }

  /* Every keyframe the roster had, kept whole rather than pruned to the seven
     that were wanted: they are two lines each, they are what the drawings were
     animated against, and a gnome added later brings its own animation with
     it and finds it already here.

     Which is how it went. The new recruits are the last three, and between
     them they wanted four animations: the legend's twinkle was already
     sitting here waiting for him, and the builder's hammer and the officer's
     donut are the two on the end — brought in with their gnomes, in the same
     two lines each, and there for whoever is drawn next. */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @keyframes bubbleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pointArm { 0%, 12%, 88%, 100% { transform: rotate(24deg); } 30%, 70% { transform: rotate(0deg); } }
  @keyframes sparkPop { 0%, 30% { opacity: 0; transform: scale(0.2); } 40% { opacity: 1; transform: scale(1); } 62% { opacity: 1; } 78%, 100% { opacity: 0; transform: scale(1.45); } }
  @keyframes swing { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
  @keyframes kickL { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-9deg); } }
  @keyframes kickR { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(7deg); } }
  @keyframes sweatDrip { 0%, 55% { opacity: 0; transform: translateY(-4px); } 65% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }
  @keyframes tinker { 0%, 55%, 100% { transform: rotate(0deg); } 8% { transform: rotate(-13deg); } 16% { transform: rotate(2deg); } 24% { transform: rotate(-13deg); } 32% { transform: rotate(2deg); } 40% { transform: rotate(-13deg); } 48% { transform: rotate(0deg); } }
  @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes hammerSwing { 0%, 55%, 100% { transform: rotate(0deg); } 8% { transform: rotate(-16deg); } 16% { transform: rotate(3deg); } 24% { transform: rotate(-16deg); } 32% { transform: rotate(3deg); } 40% { transform: rotate(-16deg); } 48% { transform: rotate(0deg); } }
  @keyframes donutLift { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(8deg); } }

  /* THE JIGGLE is lab 2's, not the roster's — see the same block in
     scroll-sticker.dc.html, where the gnome on the roller shakes for the same
     reason. Out here there is only one of the two triggers: a loose gnome is
     not holding anything, so nothing can pull him; but he is a feature on the
     bench like any other, and frames.js writes data-lab-drag onto this
     document's <html> for as long as somebody is carrying him about. Picked
     up by the hat, he squirms. */
  @keyframes jiggle {
    0%, 100% { transform: rotate(-4deg); }
    25%      { transform: rotate(3.5deg); }
    50%      { transform: rotate(-2.5deg); }
    75%      { transform: rotate(4.5deg); }
  }
  html[data-lab-drag] [data-gnome] { animation: jiggle .3s ease-in-out infinite; }
  [data-gnome] { transform-origin: 50% 30%; }

  /* the whole-body bob above is on the svg root, so it already gets its own
     compositor layer and THE CROWD (bare.css) never touches it — a gnome
     always drifts. His TOOL never did: pointArm, tinker, hammerSwing and the
     rest live on a g *inside* the svg, which the crowd rule holds still on
     purpose. Bare.css also offers a data-always-animate marker for this, but
     adding any new attribute to this particular root div (the one carrying
     data-screen-label) empties the whole render — something elsewhere reads
     that div's attribute list and chokes on an unrecognized one. Riding the
     existing data-gnome attribute instead of a new one sidesteps that; one
     selector-step more specific than the crowd rule still wins under
     !important on specificity alone, same reasoning as bare.css's version. */
  html[data-lab-crowd] [data-gnome] svg * { animation-play-state: running !important; }
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;who&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;default&quot;:&quot;thinker&quot;,&quot;options&quot;:[&quot;thinker&quot;,&quot;pointer&quot;,&quot;farmer&quot;,&quot;mechanic&quot;,&quot;librarian&quot;,&quot;politician&quot;,&quot;puppy-eyes&quot;,&quot;builder&quot;,&quot;officer&quot;,&quot;legend&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gnome&quot;}}">
/* ONE FILE, TEN GNOMES, TEN FEATURES.
   The roster was drawn as a single screen with the whole lot standing in a
   row, and the row is not what the bench wants: each of them is to be picked
   up and put down on its own, which on this bench means each is its own .gz.
   Ten near-identical documents would be ten copies of the same helmet and the
   same thirteen keyframes, so instead there is ONE document and the section
   says which gnome it wants in its data-src — features/gnome.dc.html#who=farmer.
   frames.js hands data-src to the frame verbatim, so the marker survives.

   THE LAST THREE CAME LATER, off a second sheet — 'New Recruits', the builder
   and the officer and the legend — and came in the way the first seven did:
   the sheet's own scaffolding left behind (its paper, its grain, its fitting
   wrapper, the name plate under each one), the drawing itself lifted whole,
   and the two hat colours that were props on that sheet written out at the
   values they were set to. A gnome here is an SVG and nothing else, which is
   what lets ten of them share one helmet.

   IT IS A HASH AND NOT A QUERY, which took a redirect to learn. `serve`, and
   every other static host with clean URLs turned on, answers .html with a 301
   to the extensionless path — and the Location it sends carries the path and
   nothing else, so ?who=farmer is dropped on the way and every frame came
   back as the default gnome. A fragment never goes to the server at all: it
   is the browser's, it is re-attached to whatever the redirect lands on, and
   it cannot be rewritten by a host that has opinions about URLs.

   `who` is also a real prop with a real default, so the file still opens as
   itself in Design Canvas with nothing on the end of it at all. */
class Component extends DCLogic {
  renderVals() {
    let who = this.props.who;
    try {
      const m = /(?:^|[#&?])who=([\w-]+)/.exec(location.hash + location.search);
      if (m) who = m[1];
    } catch (e) {}
    who = who || 'thinker';
    return {
      isThinker: who === 'thinker',
      isPointer: who === 'pointer',
      isFarmer: who === 'farmer',
      isMechanic: who === 'mechanic',
      isLibrarian: who === 'librarian',
      isPolitician: who === 'politician',
      isPuppyEyes: who === 'puppy-eyes',
      isBuilder: who === 'builder',
      isOfficer: who === 'officer',
      isLegend: who === 'legend',
    };
  }
}
</script>
