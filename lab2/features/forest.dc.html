<style>
  body { margin: 0; }

  /* The sheet's four keyframes, kept whole rather than pruned to the ones the
     drawings actually reach for: they are one line each, they are what the
     forest was animated against, and a part added later brings its animation
     with it and finds it already here. Which is how the gnomes' thirteen got
     here, and the argument is the same one. */
  @keyframes sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  @keyframes leafFall { 0%, 100% { transform: translateY(0) rotate(-14deg); } 50% { transform: translateY(10px) rotate(10deg); } }

  /* THE JIGGLE is lab 2's, not the sheet's — the same three lines gnome.dc.html
     and scroll-sticker.dc.html carry, for the same reason: frames.js writes
     data-lab-drag onto this document's <html> for as long as somebody is
     carrying the thing about, and a tree picked up by the top of its canopy
     ought to shake. */
  @keyframes jiggle {
    0%, 100% { transform: rotate(-4deg); }
    25%      { transform: rotate(3.5deg); }
    50%      { transform: rotate(-2.5deg); }
    75%      { transform: rotate(4.5deg); }
  }
  /* !important on both, and only under data-lab-drag: the sway now rides on
     the svg roots' own style= (so the whole filtered tree composites), and an
     inline animation would otherwise beat this rule for the length of the
     carry. The bare rule below keeps NO !important on purpose — at rest the
     inline sway origin must win it. */
  html[data-lab-drag] [data-forest] > * { animation: jiggle .3s ease-in-out infinite !important; transform-origin: 50% 80% !important; }
  [data-forest] > * { transform-origin: 50% 80%; }
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;part&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;default&quot;:&quot;the-elder&quot;,&quot;options&quot;:[&quot;the-elder&quot;,&quot;the-younger&quot;,&quot;the-broad&quot;,&quot;the-ancient&quot;,&quot;the-pine&quot;,&quot;slim-pine&quot;,&quot;the-spruce&quot;,&quot;bent-pine&quot;,&quot;the-sapling&quot;,&quot;the-leaner&quot;,&quot;the-twins&quot;,&quot;the-sprout&quot;,&quot;the-oak&quot;,&quot;the-acorn&quot;,&quot;the-hollow&quot;,&quot;the-gnarled&quot;,&quot;tall-tuft&quot;,&quot;meadow-mound&quot;,&quot;wild-sprigs&quot;,&quot;plain-blades&quot;,&quot;grand-toadstool&quot;,&quot;honey-caps&quot;,&quot;pink-bonnets&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forest&quot;},&quot;season&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;summer&quot;,&quot;options&quot;:[&quot;summer&quot;,&quot;autumn&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Foliage&quot;},&quot;toadstoolCap&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e8484a&quot;,&quot;options&quot;:[&quot;#e8484a&quot;,&quot;#e0598c&quot;,&quot;#7a5aa0&quot;,&quot;#5a8fd6&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mushrooms&quot;},&quot;sparkles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Scene&quot;}}">
/* ONE FILE, TWENTY-THREE PARTS, TWENTY-THREE FEATURES.
   The forest was drawn as a single sheet — sixteen trees, four patches of
   grass and three clumps of mushrooms, in three labelled rows with a name
   plate under every one — and the sheet is not what the bench wants: each
   part is to be picked up, put down and re-cut on its own, which on this
   bench means each is its own .gz. Twenty-three near-identical documents
   would be twenty-three copies of the same helmet and the same four
   keyframes, so instead there is ONE document and the section says which part
   it wants in its data-src — features/forest.dc.html#part=the-oak. frames.js
   hands data-src to the frame verbatim, so the marker survives.

   IT IS A HASH AND NOT A QUERY, and the reason is written out at length in
   gnome.dc.html, which does the same thing with #who=. Short version: a
   static host with clean URLs answers .html with a 301 that drops the query
   string, and a fragment never goes to the server at all.

   WHAT WAS LEFT BEHIND is the sheet's own scaffolding — its paper, its grain,
   the title card, the three row headings, the flex rows that laid the parts
   out and THE NAME PLATE UNDER EVERY ONE. A part on the bench is an SVG and
   nothing else. The plates are what made it a contact sheet, and a tree
   standing on the paper with THE OAK printed under it is a specimen in a
   catalogue rather than a tree in a wood. Nothing else about the drawings was
   touched: the svgs below are the export's, verbatim, down to the
   {{ leafMain }} the palette fills in.

   SEASON, CAP AND SPARKLES ARE STILL PROPS, at the sheet's own defaults —
   summer leaves, a red toadstool, twinkles on. They are per-DOCUMENT and this
   file is one document per frame, so a future section is one #part= and one
   more marker away from an autumn tree standing next to a summer one. Nothing
   on the bench asks for that yet.

   `part` is a real prop with a real default, so the file still opens as
   itself in Design Canvas with nothing on the end of it at all. */
class Component extends DCLogic {
  renderVals() {
    let part = this.props.part;
    try {
      const m = /(?:^|[#&?])part=([\w-]+)/.exec(location.hash + location.search);
      if (m) part = m[1];
    } catch (e) {}
    part = part || 'the-elder';
    const season = this.props.season ?? 'summer';
    const pal = season === 'autumn'
      ? { leafMain: '#e08a3c', leafDark: '#c76b28', leafLite: '#ffd23f' }
      : { leafMain: '#7bc264', leafDark: '#4e8c3f', leafLite: '#a8d68a' };
    return {
      ...pal,
      capA: this.props.toadstoolCap ?? '#e8484a',
      sparkles: this.props.sparkles ?? true,
      isTheElder: part === 'the-elder',
      isTheYounger: part === 'the-younger',
      isTheBroad: part === 'the-broad',
      isTheAncient: part === 'the-ancient',
      isThePine: part === 'the-pine',
      isSlimPine: part === 'slim-pine',
      isTheSpruce: part === 'the-spruce',
      isBentPine: part === 'bent-pine',
      isTheSapling: part === 'the-sapling',
      isTheLeaner: part === 'the-leaner',
      isTheTwins: part === 'the-twins',
      isTheSprout: part === 'the-sprout',
      isTheOak: part === 'the-oak',
      isTheAcorn: part === 'the-acorn',
      isTheHollow: part === 'the-hollow',
      isTheGnarled: part === 'the-gnarled',
      isTallTuft: part === 'tall-tuft',
      isMeadowMound: part === 'meadow-mound',
      isWildSprigs: part === 'wild-sprigs',
      isPlainBlades: part === 'plain-blades',
      isGrandToadstool: part === 'grand-toadstool',
      isHoneyCaps: part === 'honey-caps',
      isPinkBonnets: part === 'pink-bonnets',
    };
  }
}
