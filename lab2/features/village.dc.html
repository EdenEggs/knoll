<!-- lab 2 shows this on its own paper — see features/bare.css -->
<link rel="stylesheet" href="./bare.css">
<!-- Rye is on the sheet exactly once, on the signpost. The export carried the
     whole family inlined as base64; this is the same two faces off the CDN,
     which is what every other feature here does. VT323 came with the export
     too and nothing on the sheet ever asks for it, so it is not here. -->
<!-- lab 2 serves these faces itself — see SELF-HOSTED in index.html -->
<link rel="stylesheet" href="../fonts/fonts.css">

<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }

  /* The sheet's seven keyframes, kept whole rather than pruned to the ones
     the parts below actually reach for — same argument as forest.dc.html's
     four: they are one line each, they are what the village was animated
     against, and a part added later brings its animation with it and finds
     it already here. */
  @keyframes kh-flicker { 0%, 100% { opacity: 1 } 10% { opacity: 0.7 } 20% { opacity: 0.95 } 34% { opacity: 0.75 } 50% { opacity: 1 } 66% { opacity: 0.8 } 82% { opacity: 0.95 } }
  @keyframes kh-bucket { from { transform: translateY(0) } to { transform: translateY(10px) } }
  @keyframes kh-wave { from { transform: rotate(-8deg) } to { transform: rotate(16deg) } }
  @keyframes kh-pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.2 } }
  @keyframes kh-spin { to { transform: rotate(360deg) } }
  @keyframes kh-sway { from { transform: skewX(-4deg) } to { transform: skewX(4deg) } }
  @keyframes kh-moonglow { 0%, 100% { opacity: 0.06 } 50% { opacity: 0.13 } }

  /* THE JIGGLE is lab 2's, not the sheet's — the same three lines
     forest.dc.html and gnome.dc.html carry. frames.js writes data-lab-drag
     onto this document's <html> for as long as somebody is carrying the
     thing about, and a lamp post picked up by its lamp ought to shake.

     :not([data-defs]) because the first child of the screen is the shared
     <defs> — a 0×0 absolutely-positioned svg holding #pine and #ds — and
     animating that is animating nothing, slowly. */
  @keyframes jiggle {
    0%, 100% { transform: rotate(-4deg); }
    25%      { transform: rotate(3.5deg); }
    50%      { transform: rotate(-2.5deg); }
    75%      { transform: rotate(4.5deg); }
  }
  html[data-lab-drag] [data-village] > svg:not([data-defs]) { animation: jiggle .3s ease-in-out infinite; }
  [data-village] > svg:not([data-defs]) { transform-origin: 50% 80%; }
</style>
</helmet>
<div data-screen-label="Village Part" data-village style="min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative">

       outline both pines <use>, and #ds is the drop shadow nearly every part
       is filtered through. It stays OUTSIDE the sc-ifs and is painted for
       every part, because a part rendered without it is a part with no
       shadow and, for the two pines, no tree at all. -->

    </defs>
  </svg>

<script type="text/x-dc" data-dc-script data-props="{&quot;part&quot;:{&quot;editor&quot;:&quot;select&quot;,&quot;default&quot;:&quot;toadstool-house&quot;,&quot;options&quot;:[&quot;toadstool-house&quot;,&quot;bonnet-house&quot;,&quot;butter-cap&quot;,&quot;stump-house&quot;,&quot;village-pine&quot;,&quot;far-pine&quot;,&quot;the-well&quot;,&quot;picket-run&quot;,&quot;lamp-post&quot;,&quot;the-signpost&quot;,&quot;pink-hat&quot;,&quot;red-hat&quot;,&quot;blue-hat&quot;,&quot;red-caps&quot;,&quot;mixed-caps&quot;,&quot;pink-caps&quot;,&quot;bloom&quot;,&quot;sprig&quot;,&quot;stepping-stones&quot;,&quot;boulder&quot;,&quot;the-sun&quot;,&quot;the-moon&quot;,&quot;firefly&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Village&quot;}}">
/* ONE FILE, TWENTY-THREE PARTS, TWENTY-THREE FEATURES.
   The village was drawn as a single asset sheet — four houses, two pines, a
   well, a fence, a lamp, a signpost, three villagers, three clumps of
   toadstools, a bloom, a sprig, stepping stones, a boulder, the sun, the moon
   and a firefly, all in one flex row — and the sheet is not what the bench
   wants: each part is to be picked up, put down and re-cut on its own, which
   on this bench means each is its own .gz. Twenty-three near-identical
   documents would be twenty-three copies of the same helmet and the same
   seven keyframes, so instead there is ONE document and the section says
   which part it wants in its data-src —
   features/village.dc.html#part=the-well. frames.js hands data-src to the
   frame verbatim, so the marker survives.

   IT IS A HASH AND NOT A QUERY, and the reason is written out at length in
   gnome.dc.html, which does the same thing with #who=. Short version: a
   static host with clean URLs answers .html with a 301 that drops the query
   string, and a fragment never goes to the server at all.

   WHAT WAS LEFT BEHIND is the sheet's own scaffolding — its white paper, the
   64/48/96 of padding it was composed with, and the flex row that laid the
   parts out side by side. There were never any name plates on this one to
   take off, which is the one job forest.dc.html had that this did not.
   Nothing about the drawings themselves was touched: the svgs above are the
   export's, verbatim, viewBox crops and all — and those crops are windows on
   ONE shared coordinate space, which is why their numbers run into the
   thousands and do not start at zero. Do not "tidy" them to 0,0; the two
   pines <use> a path defined in that space and would walk off their own
   frames.

   THERE ARE NO OTHER PROPS. Every colour on this sheet is a literal, unlike
   the forest's season/cap/sparkles — so a red toadstool house is a red
   toadstool house, and a pink one is a different part rather than the same
   part in another colour. That is the sheet's choice, not a simplification
   made here.

   `part` is a real prop with a real default, so the file still opens as
   itself in Design Canvas with nothing on the end of it at all. */
class Component extends DCLogic {
  renderVals() {
    let part = this.props.part;
    try {
      const m = /(?:^|[#&?])part=([\w-]+)/.exec(location.hash + location.search);
      if (m) part = m[1];
    } catch (e) {}
    part = part || 'toadstool-house';
    return {
      isToadstoolHouse: part === 'toadstool-house',
      isBonnetHouse: part === 'bonnet-house',
      isButterCap: part === 'butter-cap',
      isStumpHouse: part === 'stump-house',
      isVillagePine: part === 'village-pine',
      isFarPine: part === 'far-pine',
      isTheWell: part === 'the-well',
      isPicketRun: part === 'picket-run',
      isLampPost: part === 'lamp-post',
      isTheSignpost: part === 'the-signpost',
      isPinkHat: part === 'pink-hat',
      isRedHat: part === 'red-hat',
      isBlueHat: part === 'blue-hat',
      isRedCaps: part === 'red-caps',
      isMixedCaps: part === 'mixed-caps',
      isPinkCaps: part === 'pink-caps',
      isBloom: part === 'bloom',
      isSprig: part === 'sprig',
      isSteppingStones: part === 'stepping-stones',
      isBoulder: part === 'boulder',
      isTheSun: part === 'the-sun',
      isTheMoon: part === 'the-moon',
      isFirefly: part === 'firefly',
    };
  }
}
</script>
