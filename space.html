<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A space · Knoll</title>
<!-- A SPACE'S OWN ADDRESS (2026-09-23): knoll.space/<slug>. vercel.json's last two
     rewrites and serve.js send every one-word address with no file behind it here,
     so every url in this page is root-absolute, as in 404.html. It draws what
     api/wall.js keeps for the space (?space=): its name on a sign, its picture, its
     paper and its inks — the form's "How it looks" (yard/new/), full size — and,
     since 2026-09-24, its RULES: the level it runs at (THREE LEVELS OF CHAOS) as a
     stamp under the sign, the ballot's clock on a council, and the way in: "go to
     the wall" opens the bench on this page (toem2/index.html ?page=). Its maker
     gets the gear (settings/) and the dashboard; anybody else signed in can ask
     the maker to be friends. Nothing here is trusted by anybody but the reader:
     every colour is the door's table's, every word is cut to its length. -->
<link rel="icon" href="/logo/logo-icon.svg">
<link rel="stylesheet" href="/lab2/fonts/fonts.css">
<script src="/account.js" defer></script>
<style>
  :root { --paper: #fdf7e3; --ink: #17120b; --card: #fffcf0; --line: #d9cdb0; --mute: #4a4054; --accent: #e8484a; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--ink); font-family: 'VT323', monospace;
    background: var(--paper); background-image: radial-gradient(rgba(38,33,42,0.10) 1px, transparent 1px); background-size: 22px 22px; }
  a { color: var(--accent); }
  ::selection { background: #ffd23f; }
  /* the house bar, as on /yard; account.js puts the corner at its right end */
  .knoll-head { display: flex; align-items: center; gap: 10px; padding: 12px 22px; background: var(--card); border-bottom: 1.5px dashed var(--line); }
  .knoll-brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: 'Sora', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .knoll-brand img { display: block; }
  .sp-slash { font-family: 'Public Sans', sans-serif; font-weight: 600; color: var(--mute); }
  .sp-crumb { min-width: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px 40px; text-align: center; }
  .sp-inks { position: absolute; left: 22px; top: 22px; display: grid; grid-template-rows: repeat(5, 24px); grid-auto-flow: column; gap: 8px; }
  .sp-inks span { width: 24px; height: 24px; box-sizing: border-box; border: 3px solid #17120b; }
  .sp-pic { display: block; width: 128px; height: 128px; object-fit: cover; margin-bottom: 26px; background: #fdf7e3; border: 4px solid #17120b; box-shadow: 6px 7px 0 rgba(60,50,80,0.2); transform: rotate(-4deg); }
  .sp-sign { max-width: min(90vw, 760px); padding: 6px 26px; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #c89b62; border: 4px solid #17120b; box-shadow: 5px 5px 0 rgba(60,50,80,0.25); font-size: clamp(32px, 6vw, 54px); letter-spacing: 1px; color: #17120b; transform: rotate(-3deg); }
  .sp-post { width: 12px; height: 90px; box-sizing: border-box; background: #8a6a42; border: 3px solid #17120b; }
  .sp-by { margin-top: 24px; font-size: 18px; letter-spacing: 2px; color: var(--mute); }
  /* the level, a rubber stamp in the space's own accent; and the ballot's clock under it on a council */
  .sp-stamp { display: inline-block; margin-top: 16px; font-size: 18px; letter-spacing: 3px; color: var(--accent); border: 3px solid var(--accent); border-radius: 4px; padding: 1px 12px; transform: rotate(-3deg); background: var(--card); }
  .sp-stamp[hidden] { display: none; }
  .sp-line { margin-top: 12px; font-size: 16px; letter-spacing: 2px; color: var(--mute); min-height: 20px; }
  .sp-act { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .sp-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .sp-btn { height: 46px; padding: 0 18px; font: 20px/1 'VT323', monospace; letter-spacing: 1px; color: #fdf7e3; background: #17120b; border: 4px solid #17120b;
    box-shadow: 5px 6px 0 rgba(60,50,80,0.2); cursor: pointer; transform: rotate(-1deg); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .sp-btn:hover:not(:disabled) { transform: rotate(-1deg) translate(1px,1px); box-shadow: 4px 5px 0 rgba(60,50,80,0.2); }
  .sp-btn:disabled { background: #7bc264; color: #17120b; cursor: default; }
  .sp-btn.is-light { background: #fdf7e3; color: #17120b; }
  .sp-btn svg { display: block; }
  .sp-note { min-height: 20px; font-size: 16px; letter-spacing: 1.5px; color: var(--mute); max-width: 560px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .sp-btn:hover:not(:disabled) { transform: rotate(-1deg); } }
</style>
</head>
<body>
<header class="knoll-head">
  <a class="knoll-brand" href="/"><img src="/logo/logo-icon.svg" alt="" width="26" height="26"><span>knoll</span></a>
  <span class="sp-slash" aria-hidden="true">/</span>
  <span class="sp-crumb" id="crumb"></span>
</header>
<main>
  <div class="sp-inks" id="inks" aria-hidden="true"></div>
  <img class="sp-pic" id="pic" alt="" hidden>
  <h1 class="sp-sign" id="sign" style="margin:0">…</h1>
  <div class="sp-post" aria-hidden="true"></div>
  <div class="sp-by" id="by"></div>
  <div class="sp-stamp" id="stamp" hidden></div>
  <div class="sp-line" id="line"></div>
  <div class="sp-act">
    <div class="sp-row" id="row"></div>
    <!-- a visitor who is signed in: ask the maker to be friends -->
    <button class="sp-btn is-light" id="ask" type="button" hidden></button>
    <div class="sp-note" id="note" role="status"></div>
  </div>
</main>
<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const slug = decodeURIComponent(location.pathname.split('/')[1] || '').toLowerCase();
  const me = (/(?:^|;\s*)knoll_in=([0-9a-f]{16})(?:;|$)/.exec(document.cookie) || [])[1] || null;
  const say = t => { $('note').textContent = t; };
  const post = body => fetch('/api/friends', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.json()).catch(() => ({ ok: false, error: 'the friends list did not answer — try again' }));
  const read = q => fetch('/api/wall' + q, { cache: 'no-store', credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  const LEVEL = { 0: 'READ-ONLY · YOURS ALONE', 1: 'TENDED · KEEPERS DECIDE', 2: 'COUNCIL · AYE OR NAY', 3: 'WILD · NOTHING IS SAFE' };
  const WORD = { 0: 'THE MAKER ALONE DRAWS HERE. EVERYBODY ELSE LOOKS.', 1: 'ANYONE MAY DRAW; THE KEEPERS DECIDE WHAT STAYS.',
                 2: 'CHANGES GO TO THE BALLOT; A STANDING DAY ON TOEM 2 LETS YOU VOTE.', 3: 'NOTHING IS SAFE HERE. THE HISTORY KEEPS EVERYTHING.' };
  const closesIn = t => { const ms = t - Date.now(); if (!(ms > 0)) return 'NOW'; const h = ms / 36e5; return h >= 48 ? 'IN ' + Math.floor(h / 24) + 'D ' + Math.floor(h % 24) + 'H' : h >= 1 ? 'IN ' + Math.floor(h) + 'H ' + Math.floor((ms % 36e5) / 6e4) + 'M' : 'IN ' + Math.max(1, Math.floor(ms / 6e4)) + ' MIN'; };
  const btn = (text, href, light, svg) => { const a = document.createElement('a'); a.className = 'sp-btn' + (light ? ' is-light' : ''); a.href = href; if (svg) a.insertAdjacentHTML('afterbegin', svg); a.append(text); return a; };
  const GEAR = '<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="3.53 3.53"></circle><circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="2.6"></circle><circle cx="12" cy="12" r="2.3" fill="currentColor"></circle></svg>';
  $('crumb').textContent = slug;

  const out = await read('?space=' + encodeURIComponent(slug));
  const sp = out && out.ok && out.space;
  if (!sp) {
    const nothing = out && out.code === 'page';
    $('sign').textContent = nothing ? 'nothing here' : 'not now';
    $('by').textContent = nothing ? 'NOTHING STANDS AT ' + location.host.replace(/^www\./, '').toUpperCase() + '/' + slug.toUpperCase() + ' YET.'
                                  : 'THE HILL DID NOT ANSWER — TRY AGAIN IN A MOMENT.';
    if (nothing && me) { const a = document.createElement('a'); a.href = '/yard/new/'; a.textContent = 'make a space of your own'; $('note').appendChild(a); }
    return;
  }

  // the look: every colour here comes from api/wall.js's own table or its hex check, never as typed
  ['paper', 'ink', 'card', 'line', 'mute', 'accent'].forEach(k => document.documentElement.style.setProperty('--' + k, sp[k]));
  document.title = sp.title + ' · Knoll';
  $('crumb').textContent = $('sign').textContent = sp.title;
  sp.inks.forEach(hex => { const s = document.createElement('span'); s.style.background = hex; $('inks').appendChild(s); });
  if (/^data:image\/jpeg;base64,/.test(sp.pic)) { $('pic').src = sp.pic; $('pic').hidden = false; }
  $('by').textContent = 'A SPACE BY ' + (sp.tag || 'A GNOME').toUpperCase() + ' · ' + new Date(sp.made).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
  // the rules: the level as a stamp, the ballot's clock on a council
  const chaos = [0, 1, 2, 3].includes(sp.chaos) ? sp.chaos : 1;
  $('stamp').textContent = LEVEL[chaos]; $('stamp').hidden = false;
  $('line').textContent = WORD[chaos];
  if (chaos === 2) read('?ballot=1&page=' + encodeURIComponent(sp.slug)).then(b => {
    if (!b || !b.ok) return;
    const n = b.queue.length;
    $('line').textContent = (n ? n + ' ON THE BALLOT' : 'THE BALLOT IS EMPTY') + ' · CLOSES ' + closesIn(b.closesAt || sp.closesAt) + ' · ' + WORD[2];
  });
  // the way in, and the maker's doors
  $('row').append(btn('go to the wall', '/toem2/?page=' + encodeURIComponent(sp.slug)));
  if (me && sp.by === me) {
    $('row').append(btn('settings', '/settings/?space=' + encodeURIComponent(sp.slug), true, GEAR), btn('dashboard', '/dashboard/?space=' + encodeURIComponent(sp.slug), true));
  }
  if (!me) { say('LOG IN TO DRAW FOR EVERYBODY, OR TO ASK ' + (sp.tag || 'THE MAKER').toUpperCase() + ' TO BE FRIENDS.'); return; }
  if (sp.by === me) return;

  const fr = await fetch('/api/friends', { cache: 'no-store', credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  if (!fr || !fr.ok) return;
  const rules = await read('?rules=1&page=' + encodeURIComponent(sp.slug));
  if (rules && rules.ok && rules.keeper) say('YOU KEEP THIS HILL WITH ' + (sp.tag || 'ITS MAKER').toUpperCase() + '.');
  // a visitor: the maker, as a friend
  const ask = $('ask'), known = fr.friends.some(f => f.id === sp.by);
  ask.textContent = known ? 'friends ✓' : 'ask ' + sp.tag + ' to be friends';
  ask.disabled = known; ask.hidden = !sp.tag;
  ask.onclick = async () => {
    ask.disabled = true;
    const r = await post({ op: 'ask', tag: sp.tag });
    if (r.ok) { ask.textContent = r.friends ? 'friends ✓' : 'asked ✓'; say(r.friends ? '' : 'IT IS IN THEIR BELL.'); }
    else { ask.disabled = false; say(String(r.error || 'that did not work').toUpperCase() + '.'); }
  };
})();
</script>
</body>
</html>
