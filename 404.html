<!DOCTYPE html>

<title>Not found · Knoll</title>
<!-- THE SITE'S 404 (2026-09-22): the Design Canvas export "Not Found", unpacked the way
     /signup and /login were. Every blob in its bundle was byte-identical to a file the
     site already keeps (support.js, lab2/vendor's React, lab2/fonts), so those are what
     load. Vercel answers any address it has nothing at with this file, and serve.js does
     the same locally, AT that address, so every url here is root-absolute: a "./" or
     "../" would resolve against /wherever/you/were/ and miss. React before the runtime,
     blocking, for the reasons /login's head gives. -->
<link rel="icon" href="/logo/logo-icon.svg">
<script src="/lab2/vendor/react.production.min.js"

<script src="/support.js"></script>
<!-- the account corner, as on every page with the house bar -->
<script src="/account.js" defer></script>

  @media (max-width: 860px) {
    .nf-root { padding: 20px 14px 0 !important; }
    .knoll-head { margin: -20px -14px 0 !important; }
    .nf-ground { margin: 0 -14px !important; }
    .nf-main { padding-top: 28px !important; }
    .nf-gnome { width: 100px !important; height: 141px !important; margin-right: -8px !important; }
    .nf-board { padding: 20px 18px 22px !important; }
  }
  @media (prefers-reduced-motion: reduce) { .nf-root * { animation: none !important; } }
</style>

      const ang = this.clamp(Math.atan2(lx - hx0c, 220) * 57.3, -14, 14);
      R.head.style.transform = 'rotate(' + ang.toFixed(1) + 'deg)';
      const dl = Math.hypot(lx - hx0c, ly - hy0c) || 1, k = Math.min(1, dl / 300);
      if (R.pupils) R.pupils.style.transform = 'translate(' + ((lx - hx0c) / dl * 5 * k).toFixed(1) + 'px,' + ((ly - hy0c) / dl * 4 * k).toFixed(1) + 'px)';
    }
    // left alone long enough, he goes and has another look himself
    if ((this.props.autoHunt ?? true) && s.phase === 'follow' && now > 4000 && now - m.lastHunt > 11000 && now - m.lastMove > 4000) this.hunt();
  };

  renderVals() {
    const s = this.state, mood = this.props.mood ?? 'puzzled', n = s.count;
    const foundLine = s.phase === 'show' && s.found ? 'FOUND · ' + s.found.line
      : (n === 0 ? 'FOUND SO FAR · NOTHING' : 'FOUND SO FAR · ' + n + (n === 1 ? ' WRONG THING' : ' WRONG THINGS') + ' · 0 PAGES');
    const busy = s.phase !== 'follow';
    return {
      armInkRef: this.armInkRef, armCoatRef: this.armCoatRef, cuffRef: this.cuffRef, cuffRef2: this.cuffRef2,
      handRef: this.handRef, handInnerRef: this.handInnerRef, gnomeRef: this.gnomeRef, headRef: this.headRef, pupilsRef: this.pupilsRef, bodyRef: this.bodyRef,
      foundLine, pile: s.pile, holding: !!s.held, heldHref: s.held ? s.held.href : '',
      posePoint: s.pose === 'point', poseGrab: s.pose === 'grab',
      lookAgain: this.lookAgain, lookBusy: busy, lookOpacity: busy ? 0.55 : 1,
      lookLabel: s.phase === 'out' ? 'LOOKING…' : (s.phase === 'show' ? 'HMM.' : 'LOOK AGAIN'),
      hint: s.coarse ? 'tap “look again” and he’ll have another rummage' : 'move your mouse off the window and he’ll reach after it',
      moodPuzzled: mood === 'puzzled', moodCheerful: mood === 'cheerful', moodGrumpy: mood === 'grumpy',
      browLift: s.lift ? -7 : 0, hatAnim: s.hatAnim,
    };
  }
}
</script>
